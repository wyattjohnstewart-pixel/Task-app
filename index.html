<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Day</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(180deg, #f3f7ff 0%, #ffffff 100%);
  color: #182033;
  padding-bottom: 90px;
}

header {
  padding: 24px 20px 12px;
  max-width: 700px;
  margin: auto;
}

h1 {
  margin: 0;
  font-size: 30px;
}

h2 {
  margin-top: 0;
}

.subtitle {
  color: #68738a;
  margin-top: 6px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 10px 16px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 5px 20px rgba(40,55,90,.09);
  border: 1px solid #e7ebf4;
}

.balance-card {
  background: linear-gradient(135deg,#6c63ff,#8b7cff);
  color: white;
  border: none;
}

.balance {
  font-size: 42px;
  font-weight: 800;
  margin: 10px 0;
}

.balance-card .subtitle {
  color: rgba(255,255,255,.8);
}

input,
select,
button {
  width: 100%;
  border-radius: 12px;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #d8deea;
  margin-top: 8px;
}

button {
  border: none;
  background: #6c63ff;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

button.secondary {
  background: #eef0ff;
  color: #5148d8;
}

button.danger {
  background: #ff5c70;
}

button.success {
  background: #22b573;
}

button.google {
  background: white;
  color: #222;
  border: 1px solid #d4d9e3;
}

.row {
  display: flex;
  gap: 8px;
}

.row > * {
  flex: 1;
}

.item {
  padding: 14px;
  border-radius: 14px;
  background: #f7f8fc;
  margin-top: 10px;
  border-left: 5px solid #6c63ff;
}

.item.done {
  opacity: .55;
  text-decoration: line-through;
}

.item-title {
  font-weight: 700;
  font-size: 17px;
}

.small {
  color: #70798c;
  font-size: 14px;
  margin-top: 4px;
}

.empty {
  color: #7b8495;
  text-align: center;
  padding: 20px 5px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.count {
  background: #eeedff;
  color: #5a51dc;
  border-radius: 20px;
  padding: 5px 10px;
  font-size: 13px;
  font-weight: 700;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  border-top: 1px solid #e1e5ee;
  display: flex;
  justify-content: space-around;
  padding: 9px 5px;
  z-index: 10;
}

.nav-btn {
  background: transparent;
  color: #6d7587;
  margin: 0;
  padding: 7px 3px;
  font-size: 12px;
}

.nav-btn.active {
  background: #eeedff;
  color: #5a51dc;
}

.nav-icon {
  display: block;
  font-size: 21px;
  margin-bottom: 2px;
}

.user-box {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-photo {
  width: 45px;
  height: 45px;
  border-radius: 50%;
}

.hidden {
  display: none !important;
}

.money-positive {
  color: #22a86b;
}

.money-negative {
  color: #e94c61;
}

hr {
  border: none;
  border-top: 1px solid #e7ebf4;
  margin: 18px 0;
}
</style>
</head>

<body>

<header>
  <h1 id="pageTitle">Home</h1>
  <div class="subtitle" id="pageSubtitle">
    Your day at a glance
  </div>
</header>

<div class="container">

<!-- HOME -->
<section id="homePage">

  <div class="card balance-card">
    <div class="subtitle">Current Balance</div>
    <div class="balance" id="homeBalance">$0.00</div>
  </div>

  <div class="card">
    <div class="section-title">
      <h2>Today's Tasks</h2>
      <span class="count" id="todayTaskCount">0</span>
    </div>
    <div id="homeTasks"></div>
  </div>

  <div class="card">
    <div class="section-title">
      <h2>Today's Homework</h2>
      <span class="count" id="todayHomeworkCount">0</span>
    </div>
    <div id="homeHomework"></div>
  </div>

  <div class="card">

    <div id="loggedOutArea">
      <h2>Account</h2>
      <p class="small">
        Sign in to save your information to your account.
      </p>

      <button class="google" onclick="googleLogin()">
        Sign in with Google
      </button>
    </div>

    <div id="loggedInArea" class="hidden">

      <div class="user-box">
        <img id="userPhoto" class="user-photo">
        <div>
          <strong id="userName"></strong>
          <div class="small" id="userEmail"></div>
        </div>
      </div>

      <button class="danger" onclick="googleLogout()">
        Sign Out
      </button>

    </div>

  </div>

</section>


<!-- MONEY -->
<section id="moneyPage" class="hidden">

  <div class="card balance-card">
    <div class="subtitle">Current Balance</div>
    <div class="balance" id="balance">$0.00</div>
  </div>

  <div class="card">

    <h2>Money</h2>

    <!-- Remove Money is now first -->
    <button class="danger" onclick="removeMoney()">
      Remove Money
    </button>

    <div class="row">
      <input
        id="moneyAmount"
        type="number"
        step="0.01"
        placeholder="Amount"
      >

      <button onclick="addMoney()">
        Add Money
      </button>
    </div>

  </div>

  <div class="card">
    <h2>Transactions</h2>
    <div id="transactions"></div>
  </div>

</section>


<!-- TO-DO -->
<section id="todoPage" class="hidden">

  <div class="card">
    <h2>Select Date</h2>

    <input
      id="taskDate"
      type="date"
      onchange="renderTasks()"
    >
  </div>

  <div class="card">

    <h2>Add Task</h2>

    <input
      id="taskName"
      placeholder="Task"
    >

    <label>Deadline</label>

    <input
      id="taskDeadline"
      type="time"
    >

    <input
      id="taskLocation"
      placeholder="Location (optional)"
    >

    <button onclick="addTask()">
      Add Task
    </button>

  </div>

  <div class="card">

    <div class="section-title">
      <h2>Tasks</h2>
      <span class="count" id="taskCount">0</span>
    </div>

    <div id="taskList"></div>

  </div>

</section>


<!-- HOMEWORK -->
<section id="homeworkPage" class="hidden">

  <div class="card">

    <h2>Add Homework</h2>

    <input
      id="homeworkName"
      placeholder="Assignment"
    >

    <input
      id="homeworkClass"
      placeholder="Class"
    >

    <label>Due date</label>

    <input
      id="homeworkDueDate"
      type="date"
    >

    <label>Due time</label>

    <input
      id="homeworkDueTime"
      type="time"
    >

    <label>Time to do it</label>

    <input
      id="homeworkDoTime"
      type="time"
    >

    <select id="homeworkPriority">

      <option value="Normal">
        Normal priority
      </option>

      <option value="High">
        High priority
      </option>

      <option value="Low">
        Low priority
      </option>

    </select>

    <button onclick="addHomework()">
      Add Homework
    </button>

  </div>


  <div class="card">

    <div class="section-title">
      <h2>Homework</h2>
      <span class="count" id="homeworkCount">0</span>
    </div>

    <div id="homeworkList"></div>

  </div>

</section>

</div>


<nav class="bottom-nav">

  <button
    class="nav-btn active"
    onclick="showPage('home',this)"
  >
    <span class="nav-icon">⌂</span>
    Home
  </button>

  <button
    class="nav-btn"
    onclick="showPage('money',this)"
  >
    <span class="nav-icon">$</span>
    Money
  </button>

  <button
    class="nav-btn"
    onclick="showPage('todo',this)"
  >
    <span class="nav-icon">✓</span>
    To-Do
  </button>

  <button
    class="nav-btn"
    onclick="showPage('homework',this)"
  >
    <span class="nav-icon">📚</span>
    Homework
  </button>

</nav>


<!-- FIREBASE -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/*
====================================================
PASTE YOUR FIREBASE CONFIG HERE
====================================================
*/

const firebaseConfig = {

  apiKey: "PASTE_API_KEY_HERE",

  authDomain: "PASTE_AUTH_DOMAIN_HERE",

  projectId: "PASTE_PROJECT_ID_HERE",

  storageBucket: "PASTE_STORAGE_BUCKET_HERE",

  messagingSenderId: "PASTE_MESSAGING_SENDER_ID_HERE",

  appId: "PASTE_APP_ID_HERE"

};


/*
====================================================
FIREBASE SETUP
====================================================
*/

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();


window.googleLogin = async function() {

  try {

    await signInWithPopup(auth,provider);

  } catch(error) {

    console.error(error);

    alert(
      "Google sign-in failed. Check the Firebase setup."
    );

  }

};


window.googleLogout = async function() {

  try {

    await signOut(auth);

    alert("You have been signed out.");

  } catch(error) {

    console.error(error);

  }

};


onAuthStateChanged(auth,(user)=>{

  if(user) {

    document
      .getElementById("loggedOutArea")
      .classList.add("hidden");

    document
      .getElementById("loggedInArea")
      .classList.remove("hidden");

    document
      .getElementById("userName")
      .textContent = user.displayName || "User";

    document
      .getElementById("userEmail")
      .textContent = user.email || "";

    document
      .getElementById("userPhoto")
      .src = user.photoURL || "";

    /*
    The account is kept signed in automatically.
    Your app data remains saved locally.
    */

  } else {

    document
      .getElementById("loggedOutArea")
      .classList.remove("hidden");

    document
      .getElementById("loggedInArea")
      .classList.add("hidden");

  }

});

</script>


<script>

/* ---------------- DATA ---------------- */

let balance =
  Number(localStorage.getItem("balance")) || 0;

let transactions =
  JSON.parse(localStorage.getItem("transactions")) || [];

let tasks =
  JSON.parse(localStorage.getItem("tasks")) || [];

let homework =
  JSON.parse(localStorage.getItem("homework")) || [];


/* ---------------- HELPERS ---------------- */

function today() {

  const d = new Date();

  const year = d.getFullYear();

  const month =
    String(d.getMonth()+1).padStart(2,"0");

  const day =
    String(d.getDate()).padStart(2,"0");

  return `${year}-${month}-${day}`;
}


function formatTime(time) {

  if(!time) return "No time";

  const parts = time.split(":");

  let hour = Number(parts[0]);

  const minute = parts[1];

  const suffix = hour >= 12 ? "PM" : "AM";

  hour = hour % 12;

  if(hour === 0) hour = 12;

  return `${hour}:${minute} ${suffix}`;
}


function formatDateTime(date,time) {

  if(!date) return "No due date";

  const d =
    new Date(`${date}T${time || "00:00"}`);

  const dateText =
    d.toLocaleDateString([],{
      month:"short",
      day:"numeric",
      year:"numeric"
    });

  return time
    ? `${dateText} at ${formatTime(time)}`
    : dateText;
}


function escapeHTML(text) {

  return String(text)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");
}


/* ---------------- NAVIGATION ---------------- */

window.showPage = function(page,button) {

  document
    .querySelectorAll("section")
    .forEach(section =>
      section.classList.add("hidden")
    );

  document
    .getElementById(page+"Page")
    .classList.remove("hidden");

  document
    .querySelectorAll(".nav-btn")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  const titles = {

    home:[
      "Home",
      "Your day at a glance"
    ],

    money:[
      "Money",
      "Track your balance"
    ],

    todo:[
      "To-Do",
      "Stay on top of your tasks"
    ],

    homework:[
      "Homework",
      "Keep your assignments organized"
    ]

  };

  document
    .getElementById("pageTitle")
    .textContent = titles[page][0];

  document
    .getElementById("pageSubtitle")
    .textContent = titles[page][1];

};


/* ---------------- MONEY ---------------- */

function saveMoney() {

  localStorage.setItem(
    "balance",
    balance
  );

  localStorage.setItem(
    "transactions",
    JSON.stringify(transactions)
  );
}


window.addMoney = function() {

  const amount =
    Number(
      document.getElementById("moneyAmount").value
    );

  if(!amount || amount <= 0) return;

  balance += amount;

  transactions.unshift({

    amount:amount,

    date:new Date().toLocaleString()

  });

  document
    .getElementById("moneyAmount")
    .value = "";

  saveMoney();

  renderMoney();

  renderHome();

};


window.removeMoney = function() {

  const amount =
    Number(
      document.getElementById("moneyAmount").value
    );

  if(!amount || amount <= 0) return;

  balance -= amount;

  transactions.unshift({

    amount:-amount,

    date:new Date().toLocaleString()

  });

  document
    .getElementById("moneyAmount")
    .value = "";

  saveMoney();

  renderMoney();

  renderHome();

};


function renderMoney() {

  document
    .getElementById("balance")
    .textContent =
      "$"+balance.toFixed(2);

  const box =
    document.getElementById("transactions");

  if(!transactions.length) {

    box.innerHTML =
      '<div class="empty">No transactions yet.</div>';

    return;
  }

  box.innerHTML =
    transactions.map(t=>{

      const positive =
        t.amount >= 0;

      return `

        <div class="item">

          <div class="item-title ${
            positive
              ? "money-positive"
              : "money-negative"
          }">

            ${positive ? "+" : "-"}
            $${Math.abs(t.amount).toFixed(2)}

          </div>

          <div class="small">
            ${escapeHTML(t.date)}
          </div>

        </div>

      `;

    }).join("");

}


/* ---------------- TASKS ---------------- */

function saveTasks() {

  localStorage.setItem(
    "tasks",
    JSON.stringify(tasks)
  );

}


window.addTask = function() {

  const name =
    document
      .getElementById("taskName")
      .value.trim();

  const deadline =
    document
      .getElementById("taskDeadline")
      .value;

  const location =
    document
      .getElementById("taskLocation")
      .value.trim();

  if(!name) return;

  tasks.push({

    id:Date.now(),

    name:name,

    date:
      document.getElementById("taskDate").value
      || today(),

    deadline:deadline,

    location:location,

    done:false

  });

  document.getElementById("taskName").value="";
  document.getElementById("taskDeadline").value="";
  document.getElementById("taskLocation").value="";

  saveTasks();

  renderTasks();

  renderHome();

};


window.toggleTask = function(id) {

  const task =
    tasks.find(t=>t.id===id);

  if(task)
    task.done=!task.done;

  saveTasks();

  renderTasks();

  renderHome();

};


window.deleteTask = function(id) {

  tasks =
    tasks.filter(t=>t.id!==id);

  saveTasks();

  renderTasks();

  renderHome();

};


function renderTasks() {

  const selectedDate =
    document.getElementById("taskDate").value
    || today();

  const list =
    tasks

      .filter(t=>t.date===selectedDate)

      .sort((a,b)=>{

        if(!a.deadline) return 1;

        if(!b.deadline) return -1;

        return a.deadline
          .localeCompare(b.deadline);

      });

  document
    .getElementById("taskCount")
    .textContent =
      list.filter(t=>!t.done).length;

  const box =
    document.getElementById("taskList");

  if(!list.length) {

    box.innerHTML =
      '<div class="empty">No tasks for this date.</div>';

    return;

  }

  box.innerHTML =
    list.map(task=>`

      <div class="item ${
        task.done ? "done" : ""
      }">

        <div class="item-title">
          ${escapeHTML(task.name)}
        </div>

        <div class="small">
          Deadline:
          ${formatTime(task.deadline)}
        </div>

        ${
          task.location
          ? `
            <div class="small">
              Location:
              ${escapeHTML(task.location)}
            </div>
          `
          : ""
        }

        <div class="row">

          <button
            class="success"
            onclick="toggleTask(${task.id})"
          >
            ${task.done ? "Undo" : "Complete"}
          </button>

          <button
            class="danger"
            onclick="deleteTask(${task.id})"
          >
            Delete
          </button>

        </div>

      </div>

    `).join("");

}


/* ---------------- HOMEWORK ---------------- */

function saveHomework() {

  localStorage.setItem(
    "homework",
    JSON.stringify(homework)
  );

}


window.addHomework = function() {

  const name =
    document
      .getElementById("homeworkName")
      .value.trim();

  const className =
    document
      .getElementById("homeworkClass")
      .value.trim();

  const dueDate =
    document
      .getElementById("homeworkDueDate")
      .value;

  const dueTime =
    document
      .getElementById("homeworkDueTime")
      .value;

  const doTime =
    document
      .getElementById("homeworkDoTime")
      .value;

  const priority =
    document
      .getElementById("homeworkPriority")
      .value;

  if(!name || !dueDate) {

    alert("Please enter the assignment and due date.");

    return;
  }

  homework.push({

    id:Date.now(),

    name:name,

    className:className,

    dueDate:dueDate,

    dueTime:dueTime,

    doTime:doTime,

    priority:priority,

    done:false

  });

  document.getElementById("homeworkName").value="";
  document.getElementById("homeworkClass").value="";
  document.getElementById("homeworkDueDate").value="";
  document.getElementById("homeworkDueTime").value="";
  document.getElementById("homeworkDoTime").value="";

  saveHomework();

  renderHomework();

  renderHome();

};


window.toggleHomework = function(id) {

  const item =
    homework.find(h=>h.id===id);

  if(item)
    item.done=!item.done;

  saveHomework();

  renderHomework();

  renderHome();

};


window.deleteHomework = function(id) {

  homework =
    homework.filter(h=>h.id!==id);

  saveHomework();

  renderHomework();

  renderHome();

};


function renderHomework() {

  const list =
    [...homework].sort((a,b)=>{

      const aDate =
        `${a.dueDate}T${a.dueTime || "23:59"}`;

      const bDate =
        `${b.dueDate}T${b.dueTime || "23:59"}`;

      return aDate.localeCompare(bDate);

    });

  document
    .getElementById("homeworkCount")
    .textContent =
      list.filter(h=>!h.done).length;

  const box =
    document.getElementById("homeworkList");

  if(!list.length) {

    box.innerHTML =
      '<div class="empty">No homework yet.</div>';

    return;

  }

  box.innerHTML =
    list.map(item=>`

      <div class="item ${
        item.done ? "done" : ""
      }">

        <div class="item-title">
          ${escapeHTML(item.name)}
        </div>

        <div class="small">
          ${
            escapeHTML(
              item.className || "No class"
            )
          }
        </div>

        <div class="small">
          Due:
          ${formatDateTime(
            item.dueDate,
            item.dueTime
          )}
        </div>

        ${
          item.doTime
          ? `
            <div class="small">
              Time to do it:
              ${formatTime(item.doTime)}
            </div>
          `
          : ""
        }

        <div class="small">
          Priority:
          ${escapeHTML(item.priority)}
        </div>

        <div class="row">

          <button
            class="success"
            onclick="toggleHomework(${item.id})"
          >
            ${item.done ? "Undo" : "Complete"}
          </button>

          <button
            class="danger"
            onclick="deleteHomework(${item.id})"
          >
            Delete
          </button>

        </div>

      </div>

    `).join("");

}

functi
