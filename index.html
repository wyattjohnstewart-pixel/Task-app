<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Task App</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7ff;
  color: #222;
}

header {
  background: white;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

header h1 {
  margin: 0;
}

.page {
  display: none;
  padding: 20px;
  padding-bottom: 100px;
}

.page.show {
  display: block;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.balance {
  font-size: 36px;
  font-weight: bold;
}

input,
select,
button {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  background: #6375ff;
  color: white;
  border: none;
  font-weight: bold;
}

.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  z-index: 9999;
}

.nav button {
  flex: 1;
  background: white;
  color: #555;
  border-radius: 0;
  margin: 0;
  padding: 12px 4px;
}

.nav button.active {
  color: #6375ff;
  font-weight: bold;
}

.item {
  padding: 14px;
  margin-top: 10px;
  border: 1px solid #ddd;
  border-radius: 12px;
}

</style>
</head>

<body>

<header>
  <h1>My Day</h1>
  <p id="date"></p>
</header>


<!-- HOME -->

<div id="home" class="page show">

  <div class="card">
    <h2>Balance</h2>
    <div class="balance" id="homeBalance">$0.00</div>
  </div>

  <div class="card">
    <h2>Today's Tasks</h2>
    <div id="homeTasks">
      No tasks today.
    </div>
  </div>

  <div class="card">
    <h2>Today's Homework</h2>
    <div id="homeHomework">
      No homework today.
    </div>
  </div>

  <div class="card">
    <h2>Today's Work</h2>
    <div id="homeWork">
      No work today.
    </div>
  </div>

</div>


<!-- MONEY -->

<div id="money" class="page">

  <div class="card">

    <h2>Money</h2>

    <div class="balance" id="moneyBalance">
      $0.00
    </div>

    <input
      id="amount"
      type="number"
      step="0.01"
      placeholder="Amount"
    >

    <input
      id="reason"
      type="text"
      placeholder="Reason"
    >

    <button onclick="addMoney()">
      + Add Money
    </button>

    <button onclick="removeMoney()">
      − Remove Money
    </button>

  </div>

  <div class="card">

    <h2>Transactions</h2>

    <div id="transactions">
      No transactions yet.
    </div>

  </div>

</div>


<!-- TO DO -->

<div id="todo" class="page">

  <div class="card">

    <h2>Add Task</h2>

    <input
      id="task"
      type="text"
      placeholder="Task"
    >

    <label>Date</label>

    <input
      id="taskDate"
      type="date"
    >

    <label>Deadline</label>

    <input
      id="taskTime"
      type="time"
    >

    <input
      id="taskLocation"
      type="text"
      placeholder="Location"
    >

    <button onclick="addTask()">
      Add Task
    </button>

  </div>

  <div class="card">

    <h2>To-Do List</h2>

    <div id="taskList">
      No tasks yet.
    </div>

  </div>

</div>


<!-- HOMEWORK -->

<div id="homework" class="page">

  <div class="card">

    <h2>Add Homework</h2>

    <input
      id="assignment"
      type="text"
      placeholder="Assignment"
    >

    <input
      id="className"
      type="text"
      placeholder="Class"
    >

    <label>Due date</label>

    <input
      id="dueDate"
      type="date"
    >

    <label>Due time</label>

    <input
      id="dueTime"
      type="time"
    >

    <label>Time to do it</label>

    <input
      id="doTime"
      type="time"
    >

    <select id="priority">

      <option>Normal</option>
      <option>High</option>
      <option>Low</option>

    </select>

    <button onclick="addHomework()">
      Add Homework
    </button>

  </div>

  <div class="card">

    <h2>Homework</h2>

    <div id="homeworkList">
      No homework yet.
    </div>

  </div>

</div>


<!-- WORK -->

<div id="work" class="page">

  <div class="card">

    <h2>Add Work</h2>

    <input
      id="workName"
      type="text"
      placeholder="Job / Shift"
    >

    <input
      id="workLocation"
      type="text"
      placeholder="Location"
    >

    <label>Date</label>

    <input
      id="workDate"
      type="date"
    >

    <label>Start time</label>

    <input
      id="workStart"
      type="time"
    >

    <label>End time</label>

    <input
      id="workEnd"
      type="time"
    >

    <button onclick="addWork()">
      Add Work
    </button>

  </div>

  <div class="card">

    <h2>Work</h2>

    <div id="workList">
      No work yet.
    </div>

  </div>

</div>


<!-- NAVIGATION -->

<div class="nav">

  <button
    id="button-home"
    class="active"
    onclick="showPage('home')">
    Home
  </button>

  <button
    id="button-money"
    onclick="showPage('money')">
    Money
  </button>

  <button
    id="button-todo"
    onclick="showPage('todo')">
    To-Do
  </button>

  <button
    id="button-homework"
    onclick="showPage('homework')">
    Homework
  </button>

  <button
    id="button-work"
    onclick="showPage('work')">
    Work
  </button>

</div>


<script>

/* -------------------------
   TAB SWITCHING
------------------------- */

function showPage(pageName) {

  var pages = document.getElementsByClassName("page");

  for (var i = 0; i < pages.length; i++) {
    pages[i].classList.remove("show");
  }

  document
    .getElementById(pageName)
    .classList.add("show");


  var buttons =
    document.querySelectorAll(".nav button");

  for (var j = 0; j < buttons.length; j++) {
    buttons[j].classList.remove("active");
  }

  document
    .getElementById("button-" + pageName)
    .classList.add("active");
}


/* -------------------------
   DATE
------------------------- */

document.getElementById("date").innerHTML =
  new Date().toLocaleDateString(
    undefined,
    {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    }
  );


/* -------------------------
   MONEY
------------------------- */

var balance =
  Number(localStorage.getItem("balance")) || 0;

var transactions =
  JSON.parse(
    localStorage.getItem("transactions") || "[]"
  );


function saveMoney() {

  localStorage.setItem(
    "balance",
    balance
  );

  localStorage.setItem(
    "transactions",
    JSON.stringify(transactions)
  );
}


function addMoney() {

  var amount =
    Number(document.getElementById("amount").value);

  var reason =
    document.getElementById("reason").value;

  if (amount <= 0 || !reason) {
    alert("Enter an amount and a reason.");
    return;
  }

  balance += amount;

  transactions.push({
    amount: amount,
    reason: reason,
    type: "+"
  });

  saveMoney();

  document.getElementById("amount").value = "";
  document.getElementById("reason").value = "";

  updateMoney();
}


function removeMoney() {

  var amount =
    Number(document.getElementById("amount").value);

  var reason =
    document.getElementById("reason").value;

  if (amount <= 0 || !reason) {
    alert("Enter an amount and a reason.");
    return;
  }

  balance -= amount;

  transactions.push({
    amount: amount,
    reason: reason,
    type: "-"
  });

  saveMoney();

  document.getElementById("amount").value = "";
  document.getElementById("reason").value = "";

  updateMoney();
}


function updateMoney() {

  document.getElementById("moneyBalance").innerHTML =
    "$" + balance.toFixed(2);

  document.getElementById("homeBalance").innerHTML =
    "$" + balance.toFixed(2);


  var box =
    document.getElementById("transactions");

  if (transactions.length === 0) {

    box.innerHTML =
      "No transactions yet.";

    return;
  }

  box.innerHTML = "";

  transactions
    .slice()
    .reverse()
    .forEach(function(t) {

      var item =
        document.createElement("div");

      item.className = "item";

      item.innerHTML =
        "<strong>" +
        t.type +
        "$" +
        Number(t.amount).toFixed(2) +
        "</strong><br>" +
        t.reason;

      box.appendChild(item);

    });
}


/* -------------------------
   TASKS
------------------------- */

var tasks =
  JSON.parse(
    localStorage.getItem("tasks") || "[]"
  );


function addTask() {

  var name =
    document.getElementById("task").value;

  if (!name) {
    alert("Enter a task.");
    return;
  }

  tasks.push({

    name: name,

    date:
      document.getElementById("taskDate").value,

    time:
      document.getElementById("taskTime").value,

    location:
      document.getElementById("taskLocation").value

  });

  localStorage.setItem(
    "tasks",
    JSON.stringify(tasks)
  );

  document.getElementById("task").value = "";
  document.getElementById("taskDate").value = "";
  document.getElementById("taskTime").value = "";
  document.getElementById("taskLocation").value = "";

  updateTasks();
}


function updateTasks() {

  var box =
    document.getElementById("taskList");

  if (tasks.length === 0) {
    box.innerHTML = "No tasks yet.";
    return;
  }

  box.innerHTML = "";

  tasks.forEach(function(t) {

    var item =
      document.createElement("div");

    item.className = "item";

    item.innerHTML =
      "<strong>" +
      t.name +
      "</strong><br>" +
      (t.date || "") +
      "<br>" +
      (t.time || "") +
      "<br>" +
      (t.location || "");

    box.appendChild(item);

  });
}


/* -------------------------
   HOMEWORK
------------------------- */

var homework =
  JSON.parse(
    localStorage.getItem("homework") || "[]"
  );


function addHomework() {

  var name =
    document.getElementById("assignment").value;

  if (!name) {
    alert("Enter an assignment.");
    return;
  }

  homework.push({

    name: name,

    className:
      document.getElementById("className").value,

    dueDate:
      document.getElementById("dueDate").value,

    dueTime:
      document.getElementById("dueTime").value,

    doTime:
      document.getElementById("doTime").value,

    priority:
      document.getElementById("priority").value

  });

  localStorage.setItem(
    "homework",
    JSON.stringify(homework)
  );

  document.getElementById("assignment").value = "";
  document.getElementById("className").value = "";
  document.getElementById("dueDate").value = "";
  document.getElementById("dueTime").value = "";
  document.getElementById("doTime").value = "";

  updateHomework();
}


function updateHomework() {

  var box =
    document.getElementById("homeworkList");

  if (homework.length === 0) {
    box.innerHTML = "No homework yet.";
    return;
  }

  box.innerHTML = "";

  homework.forEach(function(h) {

    var item =
      document.createElement("div");

    item.className = "item";

    item.innerHTML =
      "<strong>" +
      h.name +
      "</strong><br>" +
      (h.className || "") +
      "<br>Due: " +
      (h.dueDate || "") +
      " " +
      (h.dueTime || "") +
      "<br>Do it: " +
      (h.doTime || "") +
      "<br>Priority: " +
      h.priority;

    box.appendChild(item);

  });
}


/* -------------------------
   WORK
------------------------- */

var work =
  JSON.parse(
    localStorage.getItem("work") || "[]"
  );


function addWork() {

  var name =
    document.getElementById("workName").value;

  if (!name) {
    alert("Enter the work name.");
    return;
  }

  work.push({

    name: name,

    location:
      document.getElementById("workLocation").value,

    date:
      document.getElementById("workDate").value,

    start:
      document.getElementById("workStart").value,

    end:
      document.getElementById("workEnd").value

  });

  localStorage.setItem(
    "work",
    JSON.stringify(work)
  );

  document.getElementById("workName").value = "";
  document.getElementById("workLocation").value = "";
  document.getElementById("workDate").value = "";
  document.getElementById("workStart").value = "";
  document.getElementById("workEnd").value = "";

  updateWork();
}


function updateWork() {

  var box =
    document.getElementById("workList");

  if (work.length === 0) {
    box.innerHTML = "No work yet.";
    return;
  }

  box.innerHTML = "";

  work.forEach(function(w) {

    var item =
      document.createElement("div");

    item.className = "item";

    item.innerHTML =
      "<strong>" +
      w.name +
      "</strong><br>" +
      (w.location || "") +
      "<br>" +
      (w.date || "") +
      "<br>" +
      (w.start || "") +
      " - " +
      (w.end || "");

    box.appendChild(item);

  });
}


/* -------------------------
   START
------------------------- */

updateMoney();
updateTasks();
updateHomework();
updateWork();

</script>

</body>
</html>
