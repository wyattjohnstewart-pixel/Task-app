<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>My Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
.app{max-width:600px;margin:auto;padding:20px 16px 100px}
h1{margin:0 0 5px;font-size:30px}
.subtitle{color:#aaa;margin-bottom:20px}
.card{background:#111;border:1px solid #292929;border-radius:18px;padding:18px;margin-bottom:15px}
.balance{font-size:42px;font-weight:bold;margin:8px 0 18px}
.buttons{display:flex;gap:10px}
button{border:0;border-radius:13px;padding:14px;color:white;font-size:16px;font-weight:bold;cursor:pointer}
.add{background:#159447;flex:1}
.subtract{background:#d73737;flex:1}
.secondary{background:#222;border:1px solid #444}
input,select{width:100%;padding:13px;margin:7px 0 10px;background:#080808;color:white;border:1px solid #444;border-radius:11px;font-size:16px}
.row{display:flex;gap:10px}.row>*{flex:1}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid #292929}
.item:last-child{border-bottom:0}
.green{color:#36d477}.red{color:#ff5252}.gray{color:#999;font-size:13px}
.check{width:21px;height:21px;margin:0;accent-color:#19a955}
.done{text-decoration:line-through;color:#777}
.delete{background:none;padding:5px;color:#777;font-size:20px}
.empty{text-align:center;color:#777;padding:20px}
nav{position:fixed;bottom:0;left:0;right:0;background:#090909;border-top:1px solid #292929;display:flex;z-index:10}
nav button{background:none;border-radius:0;color:#888;flex:1;padding:10px 5px;font-size:13px}
nav button.active{color:#fff}
.icon{display:block;font-size:22px;margin-bottom:3px}
.hidden{display:none}
</style>
</head>

<body>
<div class="app">

<h1 id="title">Money</h1>
<div class="subtitle" id="subtitle">Track your money</div>

<!-- MONEY -->
<section id="moneyTab">

<div class="card">
<div class="gray">CURRENT BALANCE</div>
<div class="balance" id="balance">$0.00</div>

<div class="buttons">
<button class="add" onclick="showMoneyForm('add')">＋ Add Money</button>
<button class="subtract" onclick="showMoneyForm('subtract')">− Take Money</button>
</div>
</div>

<div class="card hidden" id="moneyForm">
<b id="moneyFormTitle">Add Money</b>
<input id="moneyAmount" type="number" min="0" step="0.01" placeholder="Amount">
<input id="moneyNote" type="text" placeholder="What was it for?">

<div class="row">
<button class="add" onclick="saveMoney()">Save</button>
<button class="secondary" onclick="hideMoneyForm()">Cancel</button>
</div>
</div>

<div class="card">
<b>Transactions</b>
<div id="transactions"></div>
</div>

</section>

<!-- TO DO -->
<section id="todoTab" class="hidden">

<div class="card">
<b>Add a Task</b>

<input id="taskName" placeholder="What do you need to do?">

<select id="taskDay">
<option>Any day</option>
<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>
<option>Saturday</option>
<option>Sunday</option>
</select>

<input id="taskPlace" placeholder="Where? (optional)">

<button class="add" style="width:100%" onclick="addTask()">＋ Add Task</button>
</div>

<div class="card">
<b>To-Do List</b>
<div id="tasks"></div>
</div>

</section>

<!-- HOMEWORK -->
<section id="homeworkTab" class="hidden">

<div class="card">
<b>Add Homework</b>

<input id="homeworkName" placeholder="Assignment">

<div class="row">
<input id="homeworkClass" placeholder="Class">
<input id="homeworkDue" type="date">
</div>

<select id="homeworkPriority">
<option>Normal Priority</option>
<option>High Priority</option>
<option>Low Priority</option>
</select>

<button class="add" style="width:100%" onclick="addHomework()">＋ Add Assignment</button>
</div>

<div class="card">
<b>Assignments</b>
<div id="homeworkList"></div>
</div>

</section>

</div>

<nav>
<button class="active" onclick="openTab('moneyTab','Money','Track your money',this)">
<span class="icon">$</span>Money
</button>

<button onclick="openTab('todoTab','To-Do','Keep track of your tasks',this)">
<span class="icon">✓</span>To-Do
</button>

<button onclick="openTab('homeworkTab','Homework','Keep track of assignments',this)">
<span class="icon">▤</span>Homework
</button>
</nav>

<script>
let transactions = JSON.parse(localStorage.getItem("transactions") || "[]");
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
let homework = JSON.parse(localStorage.getItem("homework") || "[]");

let moneyMode = "add";

function saveData(){
localStorage.setItem("transactions",JSON.stringify(transactions));
localStorage.setItem("tasks",JSON.stringify(tasks));
localStorage.setItem("homework",JSON.stringify(homework));
}

function openTab(tab,title,subtitle,button){
document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
document.getElementById(tab).classList.remove("hidden");

document.getElementById("title").textContent=title;
document.getElementById("subtitle").textContent=subtitle;

document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
}

function showMoneyForm(mode){
moneyMode=mode;
document.getElementById("moneyForm").classList.remove("hidden");
document.getElementById("moneyFormTitle").textContent=
mode==="add" ? "Add Money" : "Take Money";
document.getElementById("moneyAmount").value="";
document.getElementById("moneyNote").value="";
document.getElementById("moneyAmount").focus();
}

function hideMoneyForm(){
document.getElementById("moneyForm").classList.add("hidden");
}

function saveMoney(){
let amount=parseFloat(document.getElementById("moneyAmount").value);
let note=document.getElementById("moneyNote").value.trim();

if(!amount || amount<=0){
alert("Enter an amount.");
return;
}

if(!note) note="No description";

transactions.unshift({
amount:moneyMode==="add"?amount:-amount,
note:note,
date:new Date().toLocaleDateString()
});

saveData();
renderMoney();
hideMoneyForm();
}

function renderMoney(){
let balance=transactions.reduce((total,t)=>total+t.amount,0);

document.getElementById("balance").textContent=
(balance<0?"-":"")+"$"+Math.abs(balance).toFixed(2);

let box=document.getElementById("transactions");

if(transactions.length===0){
box.innerHTML='<div class="empty">No transactions yet.</div>';
return;
}

box.innerHTML=transactions.map((t,i)=>`
<div class="item">
<div>
<b>${escapeHTML(t.note)}</b>
<div class="gray">${t.date}</div>
</div>

<div class="${t.amount>=0?"green":"red"}">
${t.amount>=0?"+":"-"}$${Math.abs(t.amount).toFixed(2)}
<button class="delete" onclick="deleteTransaction(${i})">×</button>
</div>
</div>
`).join("");
}

function deleteTransaction(i){
if(confirm("Delete this transaction?")){
transactions.splice(i,1);
saveData();
renderMoney();
}
}

function addTask(){
let name=document.getElementById("taskName").value.trim();
let day=document.getElementById("taskDay").value;
let place=document.getElementById("taskPlace").value.trim();

if(!name){
alert("Enter a task.");
return;
}

tasks.unshift({
name:name,
day:day,
place:place,
done:false
});

document.getElementById("taskName").value="";
document.getElementById("taskPlace").value="";

saveData();
renderTasks();
}

function renderTasks(){
let box=document.getElementById("tasks");

if(tasks.length===0){
box.innerHTML='<div class="empty">No tasks yet.</div>';
return;
}

box.innerHTML=tasks.map((t,i)=>`
<div class="item">
<div style="display:flex;gap:9px;align-items:center">
<input class="check" type="checkbox"
${t.done?"checked":""}
onchange="toggleTask(${i})">

<div class="${t.done?"done":""}">
<b>${escapeHTML(t.name)}</b>
<div class="gray">
${t.day}${t.place?" · "+escapeHTML(t.place):""}
</div>
</div>
</div>

<button class="delete" onclick="deleteTask(${i})">×</button>
</div>
`).join("");
}

function toggleTask(i){
tasks[i].done=!tasks[i].done;
saveData();
renderTasks();
}

function deleteTask(i){
if(confirm("Delete this task?")){
tasks.splice(i,1);
saveData();
renderTasks();
}
}

function addHomework(){
let name=document.getElementById("homeworkName").value.trim();
let cls=document.getElementById("homeworkClass").value.trim();
let due=document.getElementById("homeworkDue").value;
let priority=document.getElementById("homeworkPriority").value;

if(!name){
alert("Enter an assignment.");
return;
}

homework.push({
name:name,
className:cls,
due:due,
priority:priority,
done:false
});

document.getElementById("homeworkName").value="";
document.getElementById("homeworkClass").value="";
document.getElementById("homeworkDue").value="";

saveData();
renderHomework();
}

function renderHomework(){
let box=document.getElementById("homeworkList");

homework.sort((a,b)=>{
if(a.done!==b.done)return a.done-b.done;
if(!a.due)return 1;
if(!b.due)return -1;
return a.due.localeCompare(b.due);
});

if(homework.length===0){
box.innerHTML='<div class="empty">No assignments yet.</div>';
return;
}

box.innerHTML=homework.map((h,i)=>`
<div class="item">
<div style="display:flex;gap:9px;align-items:center">
<input class="check" type="checkbox"
${h.done?"checked":""}
onchange="toggleHomework(${i})">

<div class="${h.done?"done":""}">
<b>${escapeHTML(h.name)}</b>
<div class="gray">
${h.className?escapeHTML(h.className)+" · ":""}
${h.due?"Due "+h.due+" · ":""}
${escapeHTML(h.priority)}
</div>
</div>
</div>

<button class="delete" onclick="deleteHomework(${i})">×</button>
</div>
`).join("");
}

function toggleHomework(i){
homework[i].done=!homework[i].done;
saveData();
renderHomework();
}

function deleteHomework(i){
if(confirm("Delete this assignment?")){
homework.splice(i,1);
saveData();
renderHomework();
}
}

function escapeHTML(text){
return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

renderMoney();
renderTasks();
renderHomework();
</script>

</body>
</html>
