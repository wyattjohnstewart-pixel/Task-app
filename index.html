<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Day</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f8ff;
  color: #172033;
  padding-bottom: 80px;
}

header {
  background: white;
  padding: 22px 18px;
  text-align: center;
  border-bottom: 1px solid #dbe7f7;
}

header h1 {
  margin: 0;
  color: #1769d2;
  font-size: 28px;
}

.page {
  display: none;
  padding: 18px;
  max-width: 650px;
  margin: auto;
}

.page.active {
  display: block;
}

h2 {
  color: #1769d2;
  margin-top: 5px;
}

.card {
  background: white;
  padding: 16px;
  margin: 12px 0;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

input,
select {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: 1px solid #cbd8ea;
  border-radius: 9px;
  font-size: 16px;
  background: white;
}

button {
  border: none;
  border-radius: 9px;
  padding: 11px 15px;
  font-size: 15px;
  cursor: pointer;
}

.blue {
  background: #1769d2;
  color: white;
}

.delete {
  background: #e53935;
  color: white;
  margin-left: 5px;
}

.done {
  background: #2e9d50;
  color: white;
}

.item {
  border-top: 1px solid #e2e8f0;
  padding: 12px 0;
}

.item:first-child {
  border-top: none;
}

.item-title {
  font-weight: bold;
  font-size: 17px;
}

.small {
  color: #65748b;
  font-size: 14px;
  margin-top: 4px;
}

.balance {
  font-size: 32px;
  font-weight: bold;
  color: #1769d2;
}

details {
  margin-top: 15px;
}

summary {
  cursor: pointer;
  font-weight: bold;
  color: #1769d2;
  padding: 8px 0;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 70px;
  background: white;
  border-top: 1px solid #dbe7f7;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 1000;
}

.bottom-nav button {
  background: transparent;
  color: #52627a;
  font-size: 12px;
  padding: 7px 8px;
}

.bottom-nav button.active {
  color: #1769d2;
  font-weight: bold;
}

.empty {
  color: #78879b;
  text-align: center;
  padding: 12px;
}
</style>
</head>

<body>

<header>
  <h1>☀️ My Day</h1>
</header>

<!-- HOME -->
<div id="home" class="page active">
  <h2>🏠 Home</h2>

  <div class="card">
    <div>💵 Balance</div>
    <div class="balance" id="homeBalance">$0.00</div>
  </div>

  <div class="card">
    <h3>✓ Today's Tasks</h3>
    <div id="todayTasks"></div>
  </div>

  <div class="card">
    <h3>📚 Today's Homework</h3>
    <div id="todayHomework"></div>
  </div>

  <div class="card">
    <h3>💼 Today's Work</h3>
    <div id="todayWork"></div>
  </div>
</div>

<!-- MONEY -->
<div id="money" class="page">
  <h2>💵 Money</h2>

  <div class="card">
    <div class="balance" id="moneyBalance">$0.00</div>

    <input id="moneyAmount" type="number" step="0.01" placeholder="Amount">

    <input id="moneyReason" type="text" placeholder="Reason">

    <button class="blue" onclick="addMoney()">＋ Add Money</button>
    <button class="blue" onclick="removeMoney()">− Remove Money</button>

    <details>
      <summary>Transactions</summary>
      <div id="transactions"></div>
    </details>
  </div>
</div>

<!-- TODO -->
<div id="todo" class="page">
  <h2>✓ To-Do</h2>

  <div class="card">
    <input id="taskName" placeholder="Task">

    <input id="taskDate" type="date">

    <input id="taskDeadline" type="time">

    <input id="taskLocation" placeholder="Location">

    <button class="blue" onclick="addTask()">＋ Add Task</button>
  </div>

  <div class="card">
    <div id="taskList"></div>
  </div>
</div>

<!-- HOMEWORK -->
<div id="homework" class="page">
  <h2>📚 Homework</h2>

  <div class="card">
    <input id="hwName" placeholder="Assignment">

    <input id="hwClass" placeholder="Class">

    <input id="hwDate" type="date">

    <input id="hwTime" type="time">

    <input id="hwDuration" type="number" placeholder="Time to do it (minutes)">

    <select id="hwPriority">
      <option value="Low">Low Priority</option>
      <option value="Medium" selected>Medium Priority</option>
      <option value="High">High Priority</option>
    </select>

    <button class="blue" onclick="addHomework()">＋ Add Homework</button>
  </div>

  <div class="card">
    <div id="homeworkList"></div>
  </div>
</div>

<!-- WORK -->
<div id="work" class="page">
  <h2>💼 Work</h2>

  <div class="card">
    <input id="workName" placeholder="Work">

    <input id="workLocation" placeholder="Location">

    <input id="workDate" type="date">

    <input id="workStart" type="time">

    <input id="workEnd" type="time">

    <button class="blue" onclick="addWork()">＋ Add Work</button>
  </div>

  <div class="card">
    <div id="workList"></div>
  </div>
</div>

<!-- NAVIGATION -->
<div class="bottom-nav">
  <button id="nav-home" onclick="showPage('home')">🏠<br>Home</button>
  <button id="nav-money" onclick="showPage('money')">💵<br>Money</button>
  <button id="nav-todo" onclick="showPage('todo')">✓<br>To-Do</button>
  <button id="nav-homework" onclick="showPage('homework')">📚<br>Homework</button>
  <button id="nav-work" onclick="showPage('work')">💼<br>Work</button>
</div>

<script>
let balance = Number(localStorage.getItem("balance")) || 0;
let transactions = JSON.parse(localStorage.getItem("transactions") || "[]");
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
let homework = JSON.parse(localStorage.getItem("homework") || "[]");
let work = JSON.parse(localStorage.getItem("work") || "[]");

function saveAll() {
  localStorage.setItem("balance", balance);
  localStorage.setItem("transactions", JSON.stringify(transactions));
  localStorage.setItem("tasks", JSON.stringify(tasks));
  localStorage.setItem("homework", JSON.stringify(homework));
  localStorage.setItem("work", JSON.stringify(work));
}

function showPage(page) {
  document.querySelectorAll(".page").forEach(function(p) {
    p.classList.remove("active");
  });

  document.getElementById(page).classList.add("active");

  document.querySelectorAll(".bottom-nav button").forEach(function(b) {
    b.classList.remove("active");
  });

  document.getElementById("nav-" + page).classList.add("active");

  renderAll();
}

function moneyFormat(amount) {
  return "$" + Number(amount).toFixed(2);
}

function addMoney() {
  const amount = Number(document.getElementById("moneyAmount").value);
  const reason = document.getElementById("moneyReason").value.trim();

  if (!amount || amount <= 0) {
    alert("Enter an amount.");
    return;
  }

  balance += amount;

  transactions.unshift({
    amount: amount,
    reason: reason || "Added money",
    type: "add",
    date: new Date().toLocaleString()
  });

  document.getElementById("moneyAmount").value = "";
  document.getElementById("moneyReason").value = "";

  saveAll();
  renderAll();
}

function removeMoney() {
  const amount = Number(document.getElementById("moneyAmount").value);
  const reason = document.getElementById("moneyReason").value.trim();

  if (!amount || amount <= 0) {
    alert("Enter an amount.");
    return;
  }

  balance -= amount;

  transactions.unshift({
    amount: amount,
    reason: reason || "Removed money",
    type: "remove",
    date: new Date().toLocaleString()
  });

  document.getElementById("moneyAmount").value = "";
  document.getElementById("moneyReason").value = "";

  saveAll();
  renderAll();
}

function addTask() {
  const name = document.getElementById("taskName").value.trim();

  if (!name) {
    alert("Enter a task.");
    return;
  }

  tasks.push({
    id: Date.now(),
    name: name,
    date: document.getElementById("taskDate").value,
    deadline: document.getElementById("taskDeadline").value,
    location: document.getElementById("taskLocation").value.trim(),
    done: false
  });

  document.getElementById("taskName").value = "";
  document.getElementById("taskDate").value = "";
  document.getElementById("taskDeadline").value = "";
  document.getElementById("taskLocation").value = "";

  saveAll();
  renderAll();
}

function addHomework() {
  const name = document.getElementById("hwName").value.trim();

  if (!name) {
    alert("Enter an assignment.");
    return;
  }

  homework.push({
    id: Date.now(),
    name: name,
    className: document.getElementById("hwClass").value.trim(),
    date: document.getElementById("hwDate").value,
    time: document.getElementById("hwTime").value,
    duration: document.getElementById("hwDuration").value,
    priority: document.getElementById("hwPriority").value,
    done: false
  });

  document.getElementById("hwName").value = "";
  document.getElementById("hwClass").value = "";
  document.getElementById("hwDate").value = "";
  document.getElementById("hwTime").value = "";
  document.getElementById("hwDuration").value = "";

  saveAll();
  renderAll();
}

function addWork() {
  const name = document.getElementById("workName").value.trim();

  if (!name) {
    alert("Enter the work.");
    return;
  }

  work.push({
    id: Date.now(),
    name: name,
    location: document.getElementById("workLocation").value.trim(),
    date: document.getElementById("workDate").value,
    start: document.getElementById("workStart").value,
    end: document.getElementById("workEnd").value,
    done: false
  });

  document.getElementById("workName").value = "";
  document.getElementById("workLocation").value = "";
  document.getElementById("workDate").value = "";
  document.getElementById("workStart").value = "";
  document.getElementById("workEnd").value = "";

  saveAll();
  renderAll();
}

function doneTask(id) {
  const item = tasks.find(x => x.id === id);
  if (item) item.done = true;
  saveAll();
  renderAll();
}

function deleteTask(id) {
  tasks = tasks.filter(x => x.id !== id);
  saveAll();
  renderAll();
}

function doneHomework(id) {
  const item = homework.find(x => x.id === id);
  if (item) item.done = true;
  saveAll();
  renderAll();
}

function deleteHomework(id) {
  homework = homework.filter(x => x.id !== id);
  saveAll();
  renderAll();
}

function doneWork(id) {
  const item = work.find(x => x.id === id);
  if (item) item.done = true;
  saveAll();
  renderAll();
}

function deleteWork(id) {
  work = work.filter(x => x.id !== id);
  saveAll();
  renderAll();
}

function todayString() {
  const d = new Date();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + month + "-" + day;
}

function taskHTML(item) {
  return `
    <div class="item">
      <div class="item-title">${escapeHTML(item.name)}</div>
      ${item.deadline ? `<div class="small">⏰ ${item.deadline}</div>` : ""}
      ${item.location ? `<div class="small">📍 ${escapeHTML(item.location)}</div>` : ""}
      <br>
      <button class="done" onclick="doneTask(${item.id})">Done</button>
      <button class="delete" onclick="deleteTask(${item.id})">Delete</button>
    </div>
  `;
}

function homeworkHTML(item) {
  return `
    <div class="item">
      <div class="item-title">${escapeHTML(item.name)}</div>
      ${item.className ? `<div class="small">Class: ${escapeHTML(item.className)}</div>` : ""}
      ${item.time ? `<div class="small">⏰ ${item.time}</div>` : ""}
      ${item.duration ? `<div class="small">⌛ ${item.duration} minutes</div>` : ""}
      <div class="small">Priority: ${escapeHTML(item.priority)}</div>
      <br>
      <button class="done" onclick="doneHomework(${item.id})">Done</button>
      <button class="delete" onclick="deleteHomework(${item.id})">Delete</button>
    </div>
  `;
}

function workHTML(item) {
  return `
    <div class="item">
      <div class="item-title">${escapeHTML(item.name)}</div>
      ${item.location ? `<div class="small">📍 ${escapeHTML(item.location)}</div>` : ""}
      ${item.start ? `<div class="small">⏰ ${item.start}${item.end ? " - " + item.end : ""}</div>` : ""}
      <br>
      <button class="done" onclick="doneWork(${item.id})">Done</button>
      <button class="delete" onclick="deleteWork(${item.id})">Delete</button>
    </div>
  `;
}

function escapeHTML(text) {
  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function renderMoney() {
  document.getElementById("moneyBalance").textContent = moneyFormat(balance);
  document.getElementById("homeBalance").textContent = moneyFormat(balance);

  const box = document.getElementById("transactions");

  if (transactions.length === 0) {
    box.innerHTML = '<div class="empty">No transactions yet.</div>';
    return;
  }

  box.innerHTML = transactions.map(t => `
    <div class="item">
      <div class="item-title">
        ${t.type === "add" ? "＋" : "−"} ${moneyFormat(t.amount)}
      </div>
      <div class="small">${escapeHTML(t.reason)}</div>
      <div class="small">${escapeHTML(t.date)}</div>
    </div>
  `).join("");
}

function renderTasks() {
  const box = document.getElementById("taskList");

  const active = tasks.filter(x => !x.done);

  if (active.length === 0) {
    box.innerHTML = '<div class="empty">No tasks.</div>';
    return;
  }

  box.innerHTML = active.map(taskHTML).join("");
}

function renderHomework() {
  const box = document.getElementById("homeworkList");

  const active = homework.filter(x => !x.done);

  if (active.length === 0) {
    box.innerHTML = '<div class="empty">No homework.</div>';
    return;
  }

  box.innerHTML = active.map(homeworkHTML).join("");
}

function renderWork() {
  const box = document.getElementById("workList");

  const active = work.filter(x => !x.done);

  if (active.length === 0) {
    box.innerHTML = '<div class="empty">No work.</div>';
    return;
  }

  box.innerHTML = active.map(workHTML).join("");
}

function renderHome() {
  const today = todayString();

  const todayTaskItems = tasks.filter(x => x.date === today && !x.done);
  const todayHomeworkItems = homework.filter(x => x.date === today && !x.done);
  const todayWorkItems = work.filter(x => x.date === today && !x.done);

  document.getElementById("todayTasks").innerHTML =
    todayTaskItems.length
      ? todayTaskItems.map(taskHTML).join("")
      : '<div class="empty">No tasks today.</div>';

  document.getElementById("todayHomework").innerHTML =
    todayHomeworkItems.length
      ? todayHomeworkItems.map(homeworkHTML).join("")
      : '<div class="empty">No homework today.</div>';

  document.getElementById("todayWork").innerHTML =
    todayWorkItems.length
      ? todayWorkItems.map(workHTML).join("")
      : '<div class="empty">No work today.</div>';
}

function renderAll() {
  renderMoney();
  renderTasks();
  renderHomework();
  renderWork();
  renderHome();
}

renderAll();
document.getElementById("nav-home").classList.add("active");
</script>

</body>
</html>
