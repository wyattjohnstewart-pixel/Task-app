<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Planner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0 0 80px 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

header {
  min-height: 76px;
  background: white;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 12px 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  position: sticky;
  top: 0;
  z-index: 900;
}

.header-left {
  text-align: left;
  font-size: 13px;
  color: #667085;
}

.header-time {
  font-size: 17px;
  font-weight: bold;
  color: #172033;
}

.header-title {
  font-size: 22px;
  font-weight: bold;
  text-align: center;
}

.header-profile {
  justify-self: end;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: bold;
}

.profile-icon {
  font-size: 22px;
}

.page {
  display: none;
  padding: 20px 16px;
  max-width: 700px;
  margin: auto;
}

.page.active {
  display: block;
}

h2 {
  margin-top: 0;
}

.section-title {
  margin: 24px 0 10px;
  font-size: 18px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.add-button {
  display: block;
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 13px;
  background: #1976d2;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 12px;
}

.form {
  display: none;
}

.form.open {
  display: block;
}

input,
select {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid #d0d5dd;
  border-radius: 9px;
  font-size: 15px;
  background: white;
}

.preset-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.preset-button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #e3f2fd;
  color: #1565c0;
  font-weight: bold;
  cursor: pointer;
}

.save-button {
  width: 100%;
  border: none;
  border-radius: 9px;
  padding: 12px;
  background: #1976d2;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.item {
  position: relative;
  background: white;
  border-radius: 13px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.item-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.item input[type="checkbox"] {
  width: 20px;
  height: 20px;
  margin: 1px 0 0;
  flex-shrink: 0;
}

.item-content {
  flex: 1;
  min-width: 0;
}

.item-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 5px;
  word-wrap: break-word;
}

.item-details {
  color: #667085;
  font-size: 13px;
  line-height: 1.5;
}

.item.completed {
  opacity: .65;
}

.item.completed .item-title {
  text-decoration: line-through;
}

.delete-button {
  margin-top: 10px;
  border: none;
  border-radius: 7px;
  padding: 7px 12px;
  background: #e53935;
  color: white;
  font-size: 13px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #667085;
  padding: 22px 10px;
}

.money-toggle {
  width: 100%;
  border: none;
  background: transparent;
  padding: 4px;
  font-size: 19px;
  font-weight: bold;
  color: #172033;
  text-align: left;
  cursor: pointer;
}

.money-dropdown {
  display: none;
  padding-top: 14px;
}

.money-dropdown.open {
  display: block;
}

#balanceDisplay {
  margin: 0;
  font-size: 28px;
}

.transaction {
  padding: 10px 0;
  border-bottom: 1px solid #eaecf0;
}

.transaction:last-child {
  border-bottom: none;
}

.transaction-description {
  font-weight: bold;
}

.transaction-meta {
  font-size: 13px;
  color: #667085;
  margin-top: 3px;
}

.money-in {
  color: #16803c;
}

.money-out {
  color: #c62828;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 68px;
  background: white;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  box-shadow: 0 -2px 10px rgba(0,0,0,.12);
  z-index: 1000;
}

.tab-button {
  border: none;
  background: white;
  color: #667085;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
  padding: 5px 2px;
}

.tab-button.active {
  color: #1976d2;
}

.tab-icon {
  display: block;
  font-size: 20px;
  margin-bottom: 2px;
}

.confetti {
  position: fixed;
  width: 8px;
  height: 12px;
  z-index: 3000;
  pointer-events: none;
  animation: confettiFall 900ms ease-out forwards;
}

@keyframes confettiFall {
  0% {
    transform: translate(0,0) rotate(0deg);
    opacity: 1;
  }

  100% {
    transform: translate(var(--x),var(--y)) rotate(500deg);
    opacity: 0;
  }
}

.trash-animation {
  position: absolute;
  width: 32px;
  height: 32px;
  font-size: 28px;
  z-index: 2500;
  pointer-events: none;
  animation: trashFly 1200ms ease-out forwards;
}

@keyframes trashFly {
  0% {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  60% {
    opacity: 1;
    transform: scale(1.15) rotate(-15deg);
  }

  100% {
    opacity: 0;
    transform: scale(.4) translateY(-35px) rotate(20deg);
  }
}

@media (max-width: 500px) {
  header {
    padding: 10px 12px;
  }

  .header-title {
    font-size: 19px;
  }

  .header-profile {
    font-size: 13px;
  }

  .header-left {
    font-size: 11px;
  }

  .header-time {
    font-size: 14px;
  }

  .page {
    padding: 18px 12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-left">
    <div class="header-time" id="headerTime"></div>
    <div id="headerDate"></div>
  </div>

  <div class="header-title">My Planner</div>

  <div class="header-profile">
    <span class="profile-icon">👤</span>
    Profile
  </div>
</header>


<!-- HOME -->
<section id="home" class="page active">
  <h2>Home</h2>

  <h3 class="section-title">✓ To-Do</h3>
  <div id="homeTasks"></div>

  <h3 class="section-title">📚 Homework</h3>
  <div id="homeHomework"></div>

  <h3 class="section-title">💼 Work</h3>
  <div id="homeWork"></div>
</section>


<!-- TO-DO -->
<section id="todo" class="page">
  <h2>To-Do</h2>

  <button class="add-button" id="todoToggle">+ Add To-Do</button>

  <div class="card form" id="todoForm">

    <input id="todoText" type="text" placeholder="Task">

    <div class="preset-row">
      <button class="preset-button" id="todoToday" type="button">Today</button>
      <button class="preset-button" id="todoTomorrow" type="button">Tomorrow</button>
    </div>

    <input id="todoDate" type="date">

    <button class="save-button" id="todoSave" type="button">
      Add To-Do
    </button>
  </div>

  <div id="tasksList"></div>
</section>


<!-- HOMEWORK -->
<section id="homework" class="page">
  <h2>Homework</h2>

  <button class="add-button" id="homeworkToggle">+ Add Homework</button>

  <div class="card form" id="homeworkForm">

    <input id="homeworkAssignment" type="text" placeholder="Assignment">

    <input id="homeworkClass" type="text" placeholder="Class">

    <div class="preset-row">
      <button class="preset-button" id="homeworkToday" type="button">
        Today
      </button>

      <button class="preset-button" id="homeworkTomorrow" type="button">
        Tomorrow
      </button>
    </div>

    <input id="homeworkDate" type="date">

    <select id="homeworkPriority">
      <option value="Low">Low Priority</option>
      <option value="Medium" selected>Medium Priority</option>
      <option value="High">High Priority</option>
    </select>

    <button class="save-button" id="homeworkSave" type="button">
      Add Homework
    </button>
  </div>

  <div id="homeworkList"></div>
</section>


<!-- WORK -->
<section id="work" class="page">
  <h2>Work</h2>

  <button class="add-button" id="workToggle">+ Add Work</button>

  <div class="card form" id="workForm">

    <input id="workName" type="text" placeholder="Work">

    <input id="workLocation" type="text" placeholder="Location">

    <div class="preset-row">
      <button class="preset-button" id="workToday" type="button">
        Today
      </button>

      <button class="preset-button" id="workTomorrow" type="button">
        Tomorrow
      </button>
    </div>

    <input id="workDate" type="date">

    <input id="workStart" type="time">
    <input id="workEnd" type="time">

    <button class="save-button" id="workSave" type="button">
      Add Work
    </button>
  </div>

  <div id="workList"></div>
</section>


<!-- MONEY -->
<section id="money" class="page">
  <h2>Money</h2>

  <div class="card">
    <button class="money-toggle" id="balanceToggle">
      💵 Balance
    </button>

    <div class="money-dropdown" id="balanceDropdown">
      <h2 id="balanceDisplay">$0.00</h2>
    </div>
  </div>


  <div class="card">
    <button class="money-toggle" id="transactionToggle">
      + Transaction
    </button>

    <div class="money-dropdown" id="transactionForm">

      <input
        id="transactionAmount"
        type="number"
        step="0.01"
        placeholder="Amount"
      >

      <select id="transactionType">
        <option value="income">Money In</option>
        <option value="expense">Money Out</option>
      </select>

      <input
        id="transactionDescription"
        type="text"
        placeholder="Description"
      >

      <button class="save-button" id="transactionSave" type="button">
        Add Transaction
      </button>
    </div>
  </div>


  <div class="card">
    <button class="money-toggle" id="historyToggle">
      Transaction History
    </button>

    <div class="money-dropdown" id="historyDropdown">
      <div id="transactionsList"></div>
    </div>
  </div>
</section>


<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button class="tab-button active" data-page="home">
    <span class="tab-icon">🏠</span>
    Home
  </button>

  <button class="tab-button" data-page="todo">
    <span class="tab-icon">✓</span>
    To-Do
  </button>

  <button class="tab-button" data-page="homework">
    <span class="tab-icon">📚</span>
    Homework
  </button>

  <button class="tab-button" data-page="work">
    <span class="tab-icon">💼</span>
    Work
  </button>

  <button class="tab-button" data-page="money">
    <span class="tab-icon">💵</span>
    Money
  </button>

</nav>


<script>
document.addEventListener("DOMContentLoaded", function () {

  /* =========================
     DATA
  ========================= */

  let balance = Number(localStorage.getItem("balance")) || 0;

  let transactions =
    JSON.parse(localStorage.getItem("transactions") || "[]");

  let tasks =
    JSON.parse(localStorage.getItem("tasks") || "[]");

  let homework =
    JSON.parse(localStorage.getItem("homework") || "[]");

  let work =
    JSON.parse(localStorage.getItem("work") || "[]");


  function saveAll() {
    localStorage.setItem("balance", balance);
    localStorage.setItem("transactions", JSON.stringify(transactions));
    localStorage.setItem("tasks", JSON.stringify(tasks));
    localStorage.setItem("homework", JSON.stringify(homework));
    localStorage.setItem("work", JSON.stringify(work));
  }


  /* =========================
     DATE / TIME
  ========================= */

  function getDateString(offsetDays) {
    const date = new Date();
    date.setDate(date.getDate() + offsetDays);

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return year + "-" + month + "-" + day;
  }


  function formatDate(dateString) {
    if (!dateString) return "";

    const date = new Date(dateString + "T00:00:00");

    return date.toLocaleDateString(undefined, {
      month: "short",
      day: "numeric",
      year: "numeric"
    });
  }


  function formatTime(timeString) {
    if (!timeString) return "";

    const parts = timeString.split(":");
    let hour = Number(parts[0]);
    const minute = parts[1];

    const suffix = hour >= 12 ? "PM" : "AM";

    hour = hour % 12;

    if (hour === 0) {
      hour = 12;
    }

    return hour + ":" + minute + " " + suffix;
  }


  function updateHeaderClock() {
    const now = new Date();

    document.getElementById("headerTime").textContent =
      now.toLocaleTimeString(undefined, {
        hour: "numeric",
        minute: "2-digit"
      });

    document.getElementById("headerDate").textContent =
      now.toLocaleDateString(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric"
      });
  }


  updateHeaderClock();
  setInterval(updateHeaderClock, 1000);


  /* =========================
     VISUAL HELPERS
  ========================= */

  function findVisibleItem(selector) {
    const activePage = document.querySelector(".page.active");

    if (activePage) {
      const visibleItem = activePage.querySelector(selector);

      if (visibleItem) {
        return visibleItem;
      }
    }

    return document.querySelector(selector);
  }


  function createConfettiAtElement(element) {
    if (!element) return;

    const rect = element.getBoundingClientRect();

    const pieces = 18;

    for (let i = 0; i < pieces; i++) {
      const confetti = document.createElement("div");

      confetti.className = "confetti";

      confetti.style.left =
        (rect.left + rect.width / 2) + "px";

      confetti.style.top =
        (rect.top + rect.height / 2) + "px";

      confetti.style.setProperty(
        "--x",
        ((Math.random() - 0.5) * 180) + "px"
      );

      confetti.style.setProperty(
        "--y",
        ((Math.random() - 0.5) * 150) + "px"
      );

      document.body.appendChild(confetti);

      setTimeout(function () {
        confetti.remove();
      }, 950);
    }
  }


  function showTrashAtElement(element) {
    if (!element) return;

    const rect = element.getBoundingClientRect();

    const trash = document.createElement("div");

    trash.className = "trash-animation";
    trash.textContent = "🗑️";

    trash.style.left =
      (rect.left + rect.width / 2 - 16) + "px";

    trash.style.top =
      (rect.top + rect.height / 2 - 16) + "px";

    document.body.appendChild(trash);

    setTimeout(function () {
      trash.remove();
    }, 1250);
  }


  /* =========================
     TO-DO
  ========================= */

  function addTask() {
    const text =
      document.getElementById("todoText").value.trim();

    const date =
      document.getElementById("todoDate").value;

    if (!text) return;

    tasks.push({
      id: Date.now(),
      text: text,
      date: date,
      done: false
    });

    saveAll();

    document.getElementById("todoText").value = "";
    document.getElementById("todoDate").value = "";

    document.getElementById("todoForm").classList.remove("open");
    document.getElementById("todoToggle").textContent =
      "+ Add To-Do";

    renderAll();
  }


  function toggleTask(id) {
    const task = tasks.find(function (item) {
      return item.id === id;
    });

    if (!task) return;

    if (!task.done) {
      const element =
        findVisibleItem('[data-task-id="' + id + '"]');

      createConfettiAtElement(element);
    }

    task.done = !task.done;

    saveAll();
    renderAll();
  }


  function deleteTask(id) {
    const element =
      findVisibleItem('[data-task-id="' + id + '"]');

    showTrashAtElement(element);

    tasks = tasks.filter(function (item) {
      return item.id !== id;
    });

    saveAll();

    setTimeout(function () {
      renderAll();
    }, 200);
  }


  function renderTasks() {
    const list = document.getElementById("tasksList");

    if (tasks.length === 0) {
      list.innerHTML =
        '<div class="empty">No To-Do\'s Yet</div>';
      return;
    }

    list.innerHTML = tasks.map(function (task) {

      return `
        <div
          class="item ${task.done ? "completed" : ""}"
          data-task-id="${task.id}"
        >
          <div class="item-row">

            <input
              type="checkbox"
              ${task.done ? "checked" : ""}
              onchange="toggleTask(${task.id})"
            >

            <div class="item-content">
              <div class="item-title">
                ${escapeHTML(task.text)}
              </div>

              <div class="item-details">
                ${task.date ? "Due: " + formatDate(task.date) : "No due date"}
              </div>
            </div>

          </div>

          <button
            class="delete-button"
            onclick="deleteTask(${task.id})"
          >
            Delete
          </button>
        </div>
      `;

    }).join("");
  }


  /* =========================
     HOMEWORK
  ========================= */

  function addHomework() {
    const assignment =
      document.getElementById("homeworkAssignment").value.trim();

    const className =
      document.getElementById("homeworkClass").value.trim();

    const date =
      document.getElementById("homeworkDate").value;

    const priority =
      document.getElementById("homeworkPriority").value;

    if (!assignment) return;

    homework.push({
      id: Date.now(),
      assignment: assignment,
      className: className,
      date: date,
      priority: priority,
      done: false
    });

    saveAll();

    document.getElementById("homeworkAssignment").value = "";
    document.getElementById("homeworkClass").value = "";
    document.getElementById("homeworkDate").value = "";
    document.getElementById("homeworkPriority").value = "Medium";

    document.getElementById("homeworkForm").classList.remove("open");
    document.getElementById("homeworkToggle").textContent =
      "+ Add Homework";

    renderAll();
  }


  function toggleHomework(id) {
    const item = homework.find(function (entry) {
      return entry.id === id;
    });

    if (!item) return;

    if (!item.done) {
      const element =
        findVisibleItem('[data-homework-id="' + id + '"]');

      createConfettiAtElement(element);
    }

    item.done = !item.done;

    saveAll();
    renderAll();
  }


  function deleteHomework(id) {
    const element =
      findVisibleItem('[data-homework-id="' + id + '"]');

    showTrashAtElement(element);

    homework = homework.filter(function (item) {
      return item.id !== id;
    });

    saveAll();

    setTimeout(function () {
      renderAll();
    }, 200);
  }


  function renderHomework() {
    const list =
      document.getElementById("homeworkList");

    if (homework.length === 0) {
      list.innerHTML =
        '<div class="empty">No Homework Yet</div>';
      return;
    }

    list.innerHTML = homework.map(function (item) {

      return `
        <div
          class="item ${item.done ? "completed" : ""}"
          data-homework-id="${item.id}"
        >

          <div class="item-row">

            <input
              type="checkbox"
              ${item.done ? "checked" : ""}
              onchange="toggleHomework(${item.id})"
            >

            <div class="item-content">

              <div class="item-title">
                ${escapeHTML(item.assignment)}
              </div>

              <div class="item-details">
                ${item.className
                  ? escapeHTML(item.className) + " • "
                  : ""}
                ${item.date
                  ? "Due: " + formatDate(item.date)
                  : "No due date"}
                <br>
                Priority: ${escapeHTML(item.priority)}
              </div>

            </div>

          </div>

          <button
            class="delete-button"
            onclick="deleteHomework(${item.id})"
          >
            Delete
          </button>

        </div>
      `;

    }).join("");
  }


  /* =========================
     WORK
  ========================= */

  function addWork() {
    const name =
      document.getElementById("workName").value.trim();

    const location =
      document.getElementById("workLocation").value.trim();

    const date =
      document.getElementById("workDate").value;

    const start =
      document.getElementById("workStart").value;

    const end =
