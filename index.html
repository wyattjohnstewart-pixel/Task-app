<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Task App</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7ff;
  color: #222;
}

header {
  background: white;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

header h1 {
  margin: 0;
  color: #3f5fe8;
}

header p {
  margin: 7px 0 0;
  color: #777;
}

.sun {
  font-size: 25px;
  margin-right: 5px;
}

.page {
  display: none;
  padding: 20px;
  padding-bottom: 100px;
  max-width: 700px;
  margin: auto;
}

.page.show {
  display: block;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.card h2 {
  margin-top: 0;
}

.balance {
  font-size: 36px;
  font-weight: bold;
  color: #222;
  margin: 10px 0;
}

input,
select,
button {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  background: #6375ff;
  color: white;
  border: none;
  font-weight: bold;
}

button:active {
  transform: scale(.98);
}

.money-button {
  margin-top: 5px;
}

.dropdown-button {
  background: #eef1ff;
  color: #3f5fe8;
  text-align: left;
  margin-top: 0;
}

.dropdown-content {
  display: none;
  margin-top: 10px;
}

.dropdown-content.show {
  display: block;
}

.item {
  padding: 14px;
  margin-top: 10px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: #fff;
}

.item-title {
  font-weight: bold;
  font-size: 17px;
}

.item-info {
  color: #666;
  margin-top: 5px;
  font-size: 14px;
}

.item-buttons {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.item-buttons button {
  margin: 0;
  flex: 1;
}

.done-button {
  background: #6375ff;
}

.delete-button {
  background: #e45d5d;
}

.empty {
  color: #777;
  padding: 8px 0;
}

.icon {
  margin-right: 7px;
}

.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  z-index: 9999;
}

.nav button {
  flex: 1;
  background: white;
  color: #555;
  border-radius: 0;
  margin: 0;
  padding: 10px 3px;
  font-size: 12px;
}

.nav button.active {
  color: #3f5fe8;
  font-weight: bold;
}

.nav-icon {
  display: block;
  font-size: 21px;
  margin-bottom: 3px;
}

.section-title {
  font-size: 19px;
  margin-bottom: 10px;
}

</style>
</head>

<body>


<!-- HEADER -->

<header>

  <h1>
    <span class="sun">☀️</span>
    My Day
  </h1>

  <p id="date"></p>

</header>


<!-- =========================
     HOME
========================= -->

<div id="home" class="page show">

  <div class="card">

    <h2>
      <span class="icon">💵</span>
      Balance
    </h2>

    <div
      class="balance"
      id="homeBalance">
      $0.00
    </div>

  </div>


  <div class="card">

    <h2>
      <span class="icon">✓</span>
      Today's Tasks
    </h2>

    <div id="homeTasks">
      No tasks today.
    </div>

  </div>


  <div class="card">

    <h2>
      <span class="icon">📚</span>
      Today's Homework
    </h2>

    <div id="homeHomework">
      No homework today.
    </div>

  </div>


  <div class="card">

    <h2>
      <span class="icon">💼</span>
      Today's Work
    </h2>

    <div id="homeWork">
      No work today.
    </div>

  </div>

</div>


<!-- =========================
     MONEY
========================= -->

<div id="money" class="page">

  <div class="card">

    <h2>
      <span class="icon">💵</span>
      Money
    </h2>

    <div
      class="balance"
      id="moneyBalance">
      $0.00
    </div>


    <input
      id="amount"
      type="number"
      step="0.01"
      placeholder="Amount"
    >


    <input
      id="reason"
      type="text"
      placeholder="Reason"
    >


    <button
      class="money-button"
      onclick="addMoney()">
      + Add Money
    </button>


    <button
      class="money-button"
      onclick="removeMoney()">
      − Remove Money
    </button>

  </div>


  <div class="card">

    <button
      class="dropdown-button"
      onclick="toggleTransactions()">

      <span class="icon">🧾</span>
      Transactions
      <span id="transactionArrow">▼</span>

    </button>


    <div
      id="transactionDropdown"
      class="dropdown-content">

      <div id="transactions">
        No transactions yet.
      </div>

    </div>

  </div>

</div>


<!-- =========================
     TO DO
========================= -->

<div id="todo" class="page">

  <div class="card">

    <h2>
      <span class="icon">✓</span>
      Add Task
    </h2>


    <input
      id="task"
      type="text"
      placeholder="Task"
    >


    <label>Date</label>

    <input
      id="taskDate"
      type="date"
    >


    <label>Deadline</label>

    <input
      id="taskTime"
      type="time"
    >


    <input
      id="taskLocation"
      type="text"
      placeholder="Location"
    >


    <button onclick="addTask()">
      Add Task
    </button>

  </div>


  <div class="card">

    <h2>
      <span class="icon">✓</span>
      To-Do List
    </h2>

    <div id="taskList">
      No tasks yet.
    </div>

  </div>

</div>


<!-- =========================
     HOMEWORK
========================= -->

<div id="homework" class="page">

  <div class="card">

    <h2>
      <span class="icon">📚</span>
      Add Homework
    </h2>


    <input
      id="assignment"
      type="text"
      placeholder="Assignment"
    >


    <input
      id="className"
      type="text"
      placeholder="Class"
    >


    <label>Due date</label>

    <input
      id="dueDate"
      type="date"
    >


    <label>Due time</label>

    <input
      id="dueTime"
      type="time"
    >


    <label>Time to do it</label>

    <input
      id="doTime"
      type="time"
    >


    <select id="priority">

      <option>Normal</option>
      <option>High</option>
      <option>Low</option>

    </select>


    <button onclick="addHomework()">
      Add Homework
    </button>

  </div>


  <div class="card">

    <h2>
      <span class="icon">📚</span>
      Homework
    </h2>

    <div id="homeworkList">
      No homework yet.
    </div>

  </div>

</div>


<!-- =========================
     WORK
========================= -->

<div id="work" class="page">

  <div class="card">

    <h2>
      <span class="icon">💼</span>
      Add Work
    </h2>


    <input
      id="workName"
      type="text"
      placeholder="Job / Shift"
    >


    <input
      id="workLocation"
      type="text"
      placeholder="Location"
    >


    <label>Date</label>

    <input
      id="workDate"
      type="date"
    >


    <label>Start time</label>

    <input
      id="workStart"
      type="time"
    >


    <label>End time</label>

    <input
      id="workEnd"
      type="time"
    >


    <button onclick="addWork()">
      Add Work
    </button>

  </div>


  <div class="card">

    <h2>
      <span class="icon">💼</span>
      Work
    </h2>

    <div id="workList">
      No work yet.
    </div>

  </div>

</div>


<!-- =========================
     BOTTOM NAV
========================= -->

<div class="nav">

  <button
    id="button-home"
    class="active"
    onclick="showPage('home')">

    <span class="nav-icon">🏠</span>
    Home

  </button>


  <button
    id="button-money"
    onclick="showPage('money')">

    <span class="nav-icon">💵</span>
    Money

  </button>


  <button
    id="button-todo"
    onclick="showPage('todo')">

    <span class="nav-icon">✓</span>
    To-Do

  </button>


  <button
    id="button-homework"
    onclick="showPage('homework')">

    <span class="nav-icon">📚</span>
    Homework

  </button>


  <button
    id="button-work"
    onclick="showPage('work')">

    <span class="nav-icon">💼</span>
    Work

  </button>

</div>


<script>


/* =========================
   TAB SWITCHING
========================= */

function showPage(pageName) {

  var pages =
    document.getElementsByClassName("page");

  for (var i = 0; i < pages.length; i++) {

    pages[i].classList.remove("show");

  }


  document
    .getElementById(pageName)
    .classList.add("show");


  var buttons =
    document.querySelectorAll(".nav button");

  for (var j = 0; j < buttons.length; j++) {

    buttons[j].classList.remove("active");

  }


  document
    .getElementById("button-" + pageName)
    .classList.add("active");

}


/* =========================
   DATE
========================= */

document.getElementById("date").innerHTML =
  new Date().toLocaleDateString(
    undefined,
    {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    }
  );


/* =========================
   MONEY
========================= */

var balance =
  Number(localStorage.getItem("balance")) || 0;


var transactions =
  JSON.parse(
    localStorage.getItem("transactions") || "[]"
  );


function saveMoney() {

  localStorage.setItem(
    "balance",
    balance
  );

  localStorage.setItem(
    "transactions",
    JSON.stringify(transactions)
  );

}


function addMoney() {

  var amount =
    Number(
      document.getElementById("amount").value
    );


  var reason =
    document.getElementById("reason").value.trim();


  if (amount <= 0 || !reason) {

    alert("Enter an amount and a reason.");

    return;

  }


  balance += amount;


  transactions.push({

    amount: amount,

    reason: reason,

    type: "+",

    date:
      new Date().toLocaleDateString()

  });


  saveMoney();


  document.getElementById("amount").value = "";

  document.getElementById("reason").value = "";


  updateMoney();

}


function removeMoney() {

  var amount =
    Number(
      document.getElementById("amount").value
    );


  var reason =
    document.getElementById("reason").value.trim();


  if (amount <= 0 || !reason) {

    alert("Enter an amount and a reason.");

    return;

  }


  balance -= amount;


  transactions.push({

    amount: amount,

    reason: reason,

    type: "-",

    date:
      new Date().toLocaleDateString()

  });


  saveMoney();


  document.getElementById("amount").value = "";

  document.getElementById("reason").value = "";


  updateMoney();

}


function updateMoney() {

  document.getElementById("moneyBalance").innerHTML =
    "$" + balance.toFixed(2);


  document.getElementById("homeBalance").innerHTML =
    "$" + balance.toFixed(2);


  var box =
    document.getElementById("transactions");


  if (transactions.length === 0) {

    box.innerHTML =
      '<div class="empty">No transactions yet.</div>';

    return;

  }


  box.innerHTML = "";


  transactions
    .slice()
    .reverse()
    .forEach(function(t) {

      var item =
        document.createElement("div");


      item.className = "item";


      item.innerHTML =

        "<div class='item-title'>" +

        t.type +

        "$" +

        Number(t.amount).toFixed(2) +

        "</div>" +

        "<div class='item-info'>" +

        t.reason +

        "</div>" +

        "<div class='item-info'>" +

        (t.date || "") +

        "</div>";


      box.appendChild(item);

    });

}


function toggleTransactions() {

  var box =
    document.getElementById(
      "transactionDropdown"
    );


  var arrow =
    document.getElementById(
      "transactionArrow"
    );


  box.classList.toggle("show");


  if (box.classList.contains("show")) {

    arrow.innerHTML = "▲";

  } else {

    arrow.innerHTML = "▼";

  }

}


/* =========================
   TASKS
========================= */

var tasks =
  JSON.parse(
    localStorage.getItem("tasks") || "[]"
  );


function addTask() {

  var name =
    document.getElementById("task").value.trim();


  if (!name) {

    alert("Enter a task.");

    return;

  }


  tasks.push({

    name: name,

    date:
      document.getElementById("taskDate").value,

    time:
      document.getElementById("taskTime").value,

    location:
      document.getElementById("taskLocation").value,

    done: false

  });


  localStorage.setItem(
    "tasks",
    JSON.stringify(tasks)
  );


  document.getElementById("task").value = "";

  document.getElementById("taskDate").value = "";

  document.getElementById("taskTime").value = "";

  document.getElementById("taskLocation").value = "";


  updateTasks();

  updateHome();

}


function completeTask(index) {

  tasks[index].done =
    !tasks[index].done;


  localStorage.setItem(
    "tasks",
    JSON.stringify(tasks)
  );


  updateTasks();

  updateHome();

}


function deleteTask(index) {

  tasks.splice(index, 1);


  localStorage.setItem(
    "tasks",
    JSON.stringify(tasks)
  );


  updateTasks();

  updateHome();

}


function updateTasks() {

  var box =
    document.getElementById("taskList");


  if (tasks.length === 0) {

    box.innerHTML =
      '<div class="empty">No tasks yet.</div>';

    return;

  }


  box.innerHTML = "";


  tasks.forEach(function(t, index) {

    var item =
      document.createElement("div");


    item.className =
      "item";


    item.innerHTML =

      "<div class='item-title'>" +

      "✓ " +

      t.name +

      "</div>" +

      "<div class='item-info'>" +

      (t.date || "No date") +

      "</div>" +

      "<div class='item-info'>" +

      (t.time || "") +

      "</div>" +

      "<div class='item-info'>" +

      (t.location || "") +

      "</div>" +


      "<div class='item-buttons'>" +

      "<button class='done-button' onclick='completeTask(" +

      index +

      ")'>" +

      (t.done ? "Undo" : "Done") +

      "</button>" +


      "<button class='delete-button' onclick='deleteTask(" +

      index +

      ")'>" +

      "Delete" +

      "</button>" +

      "</div>";


    box.appendChild(item);

  });

}


/* =========================
   HOMEWORK
========================= */

var homework =
  JSON.parse(
    localStorage.getItem("homework") || "[]"
  );


function addHomework() {

  var name =
    document
      .getElementById("assignment")
      .value.trim();


  if (!name) {

    alert("Enter an assignment.");

    return;

  }


  homework.push({

    name: name,

    className:
      document.getElementById("className").value,

    dueDate:
      document.getElementById("dueDate").value,

    dueTime:
      document.getElementById("dueTime").value,

    doTime:
      document.getElementById("doTime").value,

    priority:
      document.getElementById("priority").value,

    done: false

  });


  localStorage.setItem(
    "homework",
    JSON.stringify(homework)
  );


  document.getElementById("assignment").value = "";

  document.getElementById("className").value = "";

  document.getElementById("dueDate").value = "";

  document.getElementById("dueTime").value = "";

  document.getElementById("doTime").value = "";


  updateHomework();

  updateHome();

}


function completeHomework(index) {

  homework[index].done =
    !homework[index].done;


  localStorage.setItem(
    "homework",
    JSON.stringify(homework)
  );


  updateHomework();

  updateHome();

}


function deleteHomework(index) {

  homework.splice(index, 1);


  localStorage.setItem(
    "homework",
    JSON.stringify(homework)
  );


  updateHomework();

  updateHome();

}


function updateHomework() {

  var box =
    document.getElementById("homeworkList");


  if (homework.length === 0) {

    box.innerHTML =
      '<div class="empty">No homework yet.</div>';

    return;

  }


  box.innerHTML = "";


  homework.forEach(function(h, index) {

    var item =
      document.createElement("div");


    item.className =
      "item";


    item.innerHTML =

      "<div class='item-title'>" +

      "📚 " +

      h.name +

      "</div>" +

      "<div class='item-info'>" +

      (h.className || "") +

      "</div>" +

      "<div class='item-info'>" +

      "Due: " +

      (h.dueDate || "No date") +

      " " +

      (h.dueTime || "") +

      "</div>" +

      "<div class='item-info'>" +

      "Do it: " +

      (h.doTime || "") +

      "</div>" +

      "<div class='item-info'>" +

      "Priority: " +

      h.priority +

      "</div>" +


      "<div class='item-buttons'>" +

      "<button class='done-button' onclick='completeHomework(" +

      index +

      ")'>" +

      (h.done ? "Undo" : "Done") +

      "</button>" +


      "<button class='delete-button' onclick='deleteHomework(" +

      index +

      ")'>" +

      "Delete" +

      "</button>" +

      "</div>";


    box.appendChild(item);

  });

}


/* =========================
   WORK
========================= */

var work =
  JSON.parse(
    localStorage.getItem("work") || "[]"
  );


function addWork() {

  var name =
    document
      .getElementById("workName")
      .value.trim();


  if (!name) {

    alert("Enter the work name.");

    return;

  }


  work.push({

    name: name,

    location:
      document.getElementById("workLocation").value,

    date:
      document.getElementById("workDate").value,

    start:
      document.getElementById("workStart").value,

    end:
      document.getElementById("workEnd").value,

    done: false

  });


  localStorage.setItem(
    "work",
    JSON.stringify(work)
  );


  document.getElementById("workName").value = "";

  document.getElementById("workLocation").value = "";

  document.getElementById("workDate").value = "";

  document.getElementById("workStart").value = "";

  document.getElementById("workEnd").value = "";


  updateWork();

  updateHome();

}


function completeWork(index) {

  work[index].done =
    !work[index].done;


  localStorage.setItem(
    "work",
    JSON.stringify(work)
  );


  updateWork();

  updateHome();

}


function deleteWork(index) {

  work.splice(index, 1);


  localStorage.setItem(
    "work",
    JSON.stringify(work)
  );


  updateWork();

  updateHome();

}


function updateWork() {

  var box =
    document.getElementById("workList");


  if (work.length === 0) {

    box.innerHTML =
      '<div class="empty">No work yet.</div>';

    return;

  }


  box.innerHTML = "";


  work.forEach(function(w, index) {

    var item =
      document.createElement("div");


    item.className =
      "item";


    item.innerHTML =

      "<div class='item-title'>" +

      "💼 " +

      w.name +

      "</div>" +

      "<div class='item-info'>" +

      (w.location || "") +

      "</div>" +

      "<div class='item-info'>" +

      (w.date || "No date") +

      "</div>" +

      "<div class='item-info'>" +

      (w.start || "") +

      " - " +

      (w.end || "") +

      "</div>" +


      "<div class='item-buttons'>" +

      "<button class='done-button' onclick='completeWork(" +

      index +

      ")'>" +

      (w.done ? "Undo" : "Done") +

      "</button>" +


      "<button class='delete-button' onclick='deleteWork(" +

      index +

      ")'>" +

      "Delete" +

      "</button>" +

      "</div>";


    box.appendChild(item);

  });

}


/* =========================
   HOME
========================= */

function updateHome() {

  var today =
    new Date()
      .toISOString()
      .split("T")[0];


  /* TASKS */

  var taskBox =
    document.getElementById("homeTasks");


  var todayTasks =
    tasks.filter(function(t) {

      return (
        t.date === today &&
        !t.done
      );

    });


  if (todayTasks.length === 0) {

    taskBox.innerHTML =
      '<div class="empty">No tasks today.</div>';

  } else {

    taskBox.innerHTML = "";


    todayTasks.forEach(function(t) {

      var item =
        document.createElement("div");


      item.className =
        "item";


      item.innerHTML =

        "<div class='item-title'>" +

        "✓ " +

        t.name +

        "</div>" +

        "<div class='item-info'>" +

        (t.time || "") +

        "</div>" +

        "<div class='item-info'>" +

        (t.location || "") +

        "</div>";


      taskBo
