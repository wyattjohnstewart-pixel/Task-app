<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Planner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
  padding-bottom: 80px;
}

/* HEADER */

header {
  background: white;
  padding: 12px 14px;
  border-bottom: 1px solid #ddd;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  min-height: 76px;
}

.header-left {
  text-align: left;
  font-size: 13px;
  color: #667080;
  line-height: 1.4;
}

.header-time {
  font-size: 16px;
  font-weight: bold;
  color: #172033;
}

.header-title {
  text-align: center;
  font-size: 21px;
  font-weight: bold;
}

.header-profile {
  text-align: right;
  color: #172033;
  font-size: 13px;
}

.profile-icon {
  font-size: 22px;
  display: block;
}

/* PAGES */

.page {
  display: none;
  padding: 20px;
  max-width: 650px;
  margin: auto;
}

.page.active {
  display: block;
}

/* CARDS */

.card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

/* ADD BUTTONS */

.add-button {
  width: 100%;
  border: none;
  background: #1976d2;
  color: white;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 14px;
}

.add-form {
  display: none;
}

.add-form.open {
  display: block;
}

/* INPUTS */

input,
select {
  width: 100%;
  padding: 11px;
  margin: 7px 0;
  border: 1px solid #ccd3dd;
  border-radius: 9px;
  font-size: 15px;
  background: white;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 8px;
}

.preset-row {
  display: flex;
  gap: 8px;
  margin: 7px 0;
}

.preset-button {
  border: none;
  background: #e4f0ff;
  color: #1976d2;
  padding: 9px 12px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.save-button {
  width: 100%;
  border: none;
  background: #1976d2;
  color: white;
  padding: 12px;
  border-radius: 9px;
  font-size: 15px;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

/* ITEMS */

.item {
  position: relative;
  background: white;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  transition: opacity 0.2s;
}

.item.completed {
  opacity: 0.65;
}

.item.completed .item-title {
  text-decoration: line-through;
}

.item-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.item-row input[type="checkbox"] {
  width: 21px;
  height: 21px;
  margin: 2px 0 0 0;
  flex-shrink: 0;
}

.item-content {
  flex: 1;
  min-width: 0;
}

.item-title {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 5px;
  word-wrap: break-word;
}

.item-details {
  color: #5f6b7a;
  font-size: 14px;
  line-height: 1.5;
}

.delete-button {
  margin-top: 10px;
  border: none;
  background: #e53935;
  color: white;
  padding: 7px 11px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

.section-title {
  margin-top: 25px;
  margin-bottom: 10px;
}

.empty {
  text-align: center;
  color: #788392;
  padding: 25px 10px;
}

/* MONEY DROPDOWNS */

.money-toggle {
  width: 100%;
  border: none;
  background: #1976d2;
  color: white;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  text-align: left;
}

.money-dropdown {
  display: none;
  margin-top: 12px;
}

.money-dropdown.open {
  display: block;
}

/* BOTTOM NAV */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 68px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  z-index: 1000;
}

.tab-button {
  flex: 1;
  border: none;
  background: white;
  color: #667080;
  font-size: 12px;
  cursor: pointer;
}

.tab-button.active {
  color: #1976d2;
  font-weight: bold;
}

.tab-icon {
  display: block;
  font-size: 21px;
  margin-bottom: 2px;
}

/* CONFETTI */

.confetti-container {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  width: 1px;
  height: 1px;
}

.confetti-piece {
  position: absolute;
  width: 7px;
  height: 12px;
  background: #1976d2;
  animation: confetti-fall 900ms ease-out forwards;
}

@keyframes confetti-fall {
  0% {
    transform: translate(0, 0) rotate(0deg);
    opacity: 1;
  }

  100% {
    transform:
      translate(var(--x), var(--y))
      rotate(var(--r));
    opacity: 0;
  }
}

/* TRASH */

.trash-popup {
  position: fixed;
  pointer-events: none;
  z-index: 9998;
}

.trash-icon {
  font-size: 32px;
  animation: trash-pop 1.15s ease-out forwards;
}

@keyframes trash-pop {
  0% {
    transform: translate(-50%, -50%) scale(0.5);
    opacity: 0;
  }

  20% {
    transform: translate(-50%, -50%) scale(1.05);
    opacity: 1;
  }

  100% {
    transform: translate(-50%, -90%) scale(0.7);
    opacity: 0;
  }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>

  <div class="header-left">
    <div class="header-time" id="headerTime"></div>
    <div id="headerDate"></div>
  </div>

  <div class="header-title">
    My Planner
  </div>

  <div class="header-profile">
    <span class="profile-icon">👤</span>
    Profile
  </div>

</header>


<!-- HOME -->

<section id="home" class="page active">

  <h2>Home</h2>

  <h3 class="section-title">✓ To-Do</h3>
  <div id="homeTasks"></div>

  <h3 class="section-title">📚 Homework</h3>
  <div id="homeHomework"></div>

  <h3 class="section-title">💼 Work</h3>
  <div id="homeWork"></div>

</section>


<!-- TO-DO -->

<section id="todo" class="page">

  <h2>To-Do</h2>

  <button class="add-button" id="todoAddButton">
    + Add To-Do
  </button>

  <div class="card add-form" id="todoForm">

    <label>What do you need to do?</label>

    <input
      id="taskText"
      type="text"
      placeholder="Example: Clean my room"
    >

    <label>When is it due? (Optional)</label>

    <div class="preset-row">

      <button
        type="button"
        class="preset-button"
        onclick="setTaskDateToday()"
      >
        Today
      </button>

      <button
        type="button"
        class="preset-button"
        onclick="setTaskDateTomorrow()"
      >
        Tomorrow
      </button>

    </div>

    <input id="taskDate" type="date">

    <button class="save-button" onclick="addTask()">
      Add To-Do
    </button>

  </div>

  <div id="tasksList"></div>

</section>


<!-- HOMEWORK -->

<section id="homework" class="page">

  <h2>Homework</h2>

  <button class="add-button" id="homeworkAddButton">
    + Add Homework
  </button>

  <div class="card add-form" id="homeworkForm">

    <label>Assignment</label>

    <input
      id="homeworkText"
      type="text"
      placeholder="Example: Math worksheet"
    >

    <label>Class</label>

    <input
      id="homeworkClass"
      type="text"
      placeholder="Example: Math"
    >

    <label>Due Date</label>

    <div class="preset-row">

      <button
        type="button"
        class="preset-button"
        onclick="setHomeworkDateToday()"
      >
        Today
      </button>

      <button
        type="button"
        class="preset-button"
        onclick="setHomeworkDateTomorrow()"
      >
        Tomorrow
      </button>

    </div>

    <input id="homeworkDate" type="date">

    <label>Priority</label>

    <select id="homeworkPriority">

      <option value="Low">Low</option>

      <option value="Medium" selected>
        Medium
      </option>

      <option value="High">High</option>

    </select>

    <button class="save-button" onclick="addHomework()">
      Add Homework
    </button>

  </div>

  <div id="homeworkList"></div>

</section>


<!-- WORK -->

<section id="work" class="page">

  <h2>Work</h2>

  <button class="add-button" id="workAddButton">
    + Add Work
  </button>

  <div class="card add-form" id="workForm">

    <label>Work</label>

    <input
      id="workText"
      type="text"
      placeholder="Example: Shift"
    >

    <label>Location</label>

    <input
      id="workLocation"
      type="text"
      placeholder="Example: Community Centre"
    >

    <label>Work Date</label>

    <div class="preset-row">

      <button
        type="button"
        class="preset-button"
        onclick="setWorkDateToday()"
      >
        Today
      </button>

      <button
        type="button"
        class="preset-button"
        onclick="setWorkDateTomorrow()"
      >
        Tomorrow
      </button>

    </div>

    <input id="workDate" type="date">

    <label>Start Time</label>

    <input id="workStart" type="time">

    <label>End Time</label>

    <input id="workEnd" type="time">

    <button class="save-button" onclick="addWork()">
      Add Work
    </button>

  </div>

  <div id="workList"></div>

</section>


<!-- MONEY — SLOT 5 -->

<section id="money" class="page">

  <h2>Money</h2>

  <div class="card">

    <button
      class="money-toggle"
      id="balanceToggle"
    >
      💵 Balance
    </button>

    <div
      class="money-dropdown"
      id="balanceDropdown"
    >

      <h2 id="balanceDisplay">
        $0.00
      </h2>

    </div>

  </div>


  <div class="card">

    <button
      class="money-toggle"
      id="transactionToggle"
    >
      + Transaction
    </button>

    <div
      class="money-dropdown"
      id="transactionForm"
    >

      <input
        id="transactionAmount"
        type="number"
        step="0.01"
        placeholder="Amount"
      >

      <select id="transactionType">

        <option value="income">
          Money In
        </option>

        <option value="expense">
          Money Out
        </option>

      </select>

      <input
        id="transactionDescription"
        type="text"
        placeholder="Description"
      >

      <button
        class="save-button"
        onclick="addTransaction()"
      >
        Add Transaction
      </button>

    </div>

  </div>


  <div class="card">

    <button
      class="money-toggle"
      id="historyToggle"
    >
      Transaction History
    </button>

    <div
      class="money-dropdown"
      id="historyDropdown"
    >

      <div id="transactionsList"></div>

    </div>

  </div>

</section>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button
    class="tab-button active"
    data-page="home"
  >
    <span class="tab-icon">🏠</span>
    Home
  </button>

  <button
    class="tab-button"
    data-page="todo"
  >
    <span class="tab-icon">✓</span>
    To-Do
  </button>

  <button
    class="tab-button"
    data-page="homework"
  >
    <span class="tab-icon">📚</span>
    Homework
  </button>

  <button
    class="tab-button"
    data-page="work"
  >
    <span class="tab-icon">💼</span>
    Work
  </button>

  <button
    class="tab-button"
    data-page="money"
  >
    <span class="tab-icon">💵</span>
    Money
  </button>

</nav>


<script>

/* DATA */

let balance =
  Number(localStorage.getItem("balance") || 0);

let transactions =
  JSON.parse(
    localStorage.getItem("transactions") || "[]"
  );

let tasks =
  JSON.parse(
    localStorage.getItem("tasks") || "[]"
  );

let homework =
  JSON.parse(
    localStorage.getItem("homework") || "[]"
  );

let work =
  JSON.parse(
    localStorage.getItem("work") || "[]"
  );


/* SAVE */

function saveAll() {

  localStorage.setItem(
    "balance",
    balance
  );

  localStorage.setItem(
    "transactions",
    JSON.stringify(transactions)
  );

  localStorage.setItem(
    "tasks",
    JSON.stringify(tasks)
  );

  localStorage.setItem(
    "homework",
    JSON.stringify(homework)
  );

  localStorage.setItem(
    "work",
    JSON.stringify(work)
  );
}


/* HEADER CLOCK */

function updateHeaderClock() {

  const now = new Date();

  document.getElementById(
    "headerTime"
  ).textContent =
    now.toLocaleTimeString(
      "en-US",
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );

  document.getElementById(
    "headerDate"
  ).textContent =
    now.toLocaleDateString(
      "en-US",
      {
        month: "short",
        day: "numeric",
        year: "numeric"
      }
    );
}

updateHeaderClock();

setInterval(
  updateHeaderClock,
  1000
);


/* DATES */

function getDateString(date) {

  return date.toISOString()
    .split("T")[0];
}

function todayString() {

  return getDateString(
    new Date()
  );
}

function tomorrowString() {

  const date =
    new Date();

  date.setDate(
    date.getDate() + 1
  );

  return getDateString(date);
}

function formatDate(dateString) {

  if (!dateString) {
    return "No due date";
  }

  const parts =
    dateString.split("-");

  if (parts.length !== 3) {
    return dateString;
  }

  const date =
    new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );

  return date.toLocaleDateString(
    "en-US",
    {
      month: "short",
      day: "numeric",
      year: "numeric"
    }
  );
}


/* TIME */

function formatTime(timeString) {

  if (!timeString) {
    return "";
  }

  const parts =
    timeString.split(":");

  let hour =
    Number(parts[0]);

  const minute =
    parts[1];

  const ampm =
    hour >= 12
      ? "PM"
      : "AM";

  hour =
    hour % 12 || 12;

  return (
    hour +
    ":" +
    minute +
    " " +
    ampm
  );
}


/* FIND VISIBLE ITEM */

function findVisibleItem(selector) {

  const activePage =
    document.querySelector(
      ".page.active"
    );

  if (activePage) {

    const item =
      activePage.querySelector(
        selector
      );

    if (item) {
      return item;
    }
  }

  return document.querySelector(
    selector
  );
}


/* CONFETTI */

function createConfettiAtElement(element) {

  if (!element) {
    return;
  }

  const rect =
    element.getBoundingClientRect();

  const container =
    document.createElement("div");

  container.className =
    "confetti-container";

  container.style.left =
    (
      rect.left +
      rect.width / 2
    ) + "px";

  container.style.top =
    (
      rect.top +
      rect.height / 2
    ) + "px";

  for (
    let i = 0;
    i < 24;
    i++
  ) {

    const piece =
      document.createElement("div");

    piece.className =
      "confetti-piece";

    const angle =
      Math.random() *
      Math.PI *
      2;

    const distance =
      50 +
      Math.random() *
      100;

    piece.style.setProperty(
      "--x",
      Math.cos(angle) *
      distance +
      "px"
    );

    piece.style.setProperty(
      "--y",
      Math.sin(angle) *
      distance +
      "px"
    );

    piece.style.setProperty(
      "--r",
      (
        Math.random() *
        720 -
        360
      ) + "deg"
    );

    container.appendChild(
      piece
    );
  }

  document.body.appendChild(
    container
  );

  setTimeout(
    function() {
      container.remove();
    },
    1000
  );
}


/* TRASH */

function showTrashAtElement(element) {

  if (!element) {
    return;
  }

  const rect =
    element.getBoundingClientRect();

  const popup =
    document.createElement("div");

  popup.className =
    "trash-popup";

  popup.style.left =
    (
      rect.left +
      rect.width / 2
    ) + "px";

  popup.style.top =
    (
      rect.top +
      rect.height / 2
    ) + "px";

  const icon =
    document.createElement("div");

  icon.className =
    "trash-icon";

  icon.textContent =
    "🗑️";

  popup.appendChild(
    icon
  );

  document.body.appendChild(
    popup
  );

  setTimeout(
    function() {
      popup.remove();
    },
    1200
  );
}


/* TO-DO */

function setTaskDateToday() {

  document.getElementById(
    "taskDate"
  ).value =
    todayString();
}

function setTaskDateTomorrow() {

  document.getElementById(
    "taskDate"
  ).value =
    tomorrowString();
}

function addTask() {

  const text =
    document.getElementById(
      "taskText"
    ).value.trim();

  const date =
    document.getElementById(
      "taskDate"
    ).value;

  if (!text) {
    return;
  }

  tasks.push({
    id: Date.now(),
    text: text,
    date: date,
    done: false
  });

  saveAll();

  document.getElementById(
    "taskText"
  ).value = "";

  document.getElementById(
    "taskDate"
  ).value = "";

  document.getElementById(
    "todoForm"
  ).classList.remove("open");

  document.getElementById(
    "todoAddButton"
  ).textContent =
    "+ Add To-Do";

  renderAll();
}

function toggleTask(id) {

  const item =
    tasks.find(
      function(task) {
        return task.id === id;
      }
    );

  if (!item || item.done) {
    return;
  }

  const element =
    findVisibleItem(
      '[data-task-id="' +
      id +
      '"]'
    );

  createConfettiAtElement(
    element
  );

  item.done = true;

  saveAll();

  renderAll();
}

function deleteTask(id) {

  const element =
    findVisibleItem(
      '[data-task-id="' +
      id +
      '"]'
    );

  showTrashAtElement(
    element
  );

  setTimeout(
    function() {

      tasks =
        tasks.filter(
          function(task) {
            return task.id !== id;
          }
        );

      saveAll();

      renderAll();

    },
    350
  );
}


/* HOMEWORK */

function setHomeworkDateToday() {

  document.getElementById(
    "homeworkDate"
  ).value =
    todayString();
}

function setHomeworkDateTomorrow() {

  document.getElementById(
    "homeworkDate"
  ).value =
    tomorrowString();
}

function addHomework() {

  const text =
    document.getElementById(
      "homeworkText"
    ).value.trim();

  const className =
    document.getElementById(
      "homeworkClass"
    ).value.trim();

  const date =
    document.getElementById(
      "homeworkDate"
    ).value;

  const priority =
    document.getElementById(
      "homeworkPriority"
    ).value;

  if (!text) {
    return;
  }

  homework.push({
    id: Date.now(),
    text: text,
    className: className,
    date: date,
    priority: priority,
    done: false
  });

  saveAll();

  document.getElementById(
    "homeworkText"
  ).value = "";

  document.getElementById(
    "homeworkClass"
  ).value = "";

  document.getElementById(
    "homeworkDate"
  ).value = "";

  document.getElementById(
    "homeworkForm"
  ).classList.remove("open");

  document.getElementById(
    "homeworkAddButton"
  ).textContent =
    "+ Add Homework";

  renderAll();
}

function toggleHomework(id) {

  const item =
    homework.find(
      function(hw) {
        return hw.id === id;
      }
    );

  if (!item || item.done) {
    return;
  }

  const element =
    findVisibleItem(
      '[data-homework-id="' +
      id +
      '"]'
    );

  createConfettiAtElement(
    element
  );

  item.done = true;

  saveAll();

  renderAll();
}

function deleteHomework(id) {

  const element =
    findVisibleItem(
      '[data-homework-id="' +
      id +
      '"]'
    );

  showTrashAtElement(
    element
  );

  setTimeout(
    function() {

      homework =
        homework.filter(
          function(hw) {
            return hw.id !== id;
          }
        );

      saveAll();

      renderAll();

    },
    350
  );
}


/* WORK */

function setWorkDateToday() {

  document.getElementById(
    "workDate"
  ).value =
    todayString();
}

function setWorkDateTomorrow() {

  document.getElementById(
    "workDate"
  ).value =
    tomorrowString();
}

function addWork() {

  const text =
    document.getElementById(
      "workText"
    ).value.trim();

  const location =
    document.getElementById(
      "workLocation"
    ).value.trim();

  const date =
    document.getElementById(
      "workDate"
    ).value;

  const start =
    document.getElementById(
      "workStart"
    ).value;

  const end =
    document.getElementById(
      "workEnd"
    ).value;

  if (!text) {
    return;
  }

  work.push({
    id: Date.now(),
    text: text,
    location: location,
    date: date,
    start: start,
    end: end,
    done: false
  });

  saveAll();

  document.getElementById(
    "workText"
  ).value = "";

  document.g
